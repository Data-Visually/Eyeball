name: Deploy to GitHub Pages

# GitHub Pages for this repo is served from the gh-pages branch (auto-enabled
# when that branch was first pushed). This workflow keeps gh-pages in sync:
# every push to a listed branch is force-pushed to gh-pages, which triggers
# GitHub's own "pages build and deployment".

on:
  push:
    branches:
      - main
      - master
      - claude/eye-tracking-mediapipe-9cq35d
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync this commit to gh-pages
        run: git push --force origin HEAD:gh-pages
