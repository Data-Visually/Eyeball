    // --------------------------- CAMERA SETUP ---------------------------
    async function startCamera() {
      if (!window.isSecureContext) {
        setStatus("Camera requires HTTPS (or localhost). Serve this page over a secure origin.", true);
        throw new Error("Insecure context: getUserMedia is unavailable.");
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("getUserMedia is not supported in this browser.", true);
        throw new Error("getUserMedia unsupported.");
      }

      setStatus("Requesting camera permission…");
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",            // front-facing camera
            // Higher capture resolution = more pixels on the eyes = less
            // iris-landmark jitter. MediaPipe crops the face region, so
            // this improves accuracy more than it costs.
            width:  { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
      } catch (err) {
        const hint = err.name === "NotAllowedError"
          ? "Permission denied — allow camera access in browser settings and reload."
          : err.name === "NotFoundError"
            ? "No front-facing camera found."
            : `Camera error: ${err.name}`;
        setStatus(hint, true);
        console.error("[Eyeball] getUserMedia error:", err);
        throw err;
      }

      video.srcObject = stream;

      // Wait until the video has real dimensions before sizing the canvas.
      await new Promise((resolve) => {
        if (video.readyState >= HTMLMediaElement.HAVE_METADATA) resolve();
        else video.addEventListener("loadedmetadata", resolve, { once: true });
      });
      // iOS Safari sometimes needs an explicit play() even with autoplay.
      try { await video.play(); } catch (e) { console.warn("[Eyeball] video.play():", e); }

      // Canvas bitmap = native camera resolution → landmark math is 1:1 with
      // the video frame; CSS object-fit handles the on-screen scaling/crop.
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      console.log(`[Eyeball] Camera ready: ${video.videoWidth}x${video.videoHeight}`);
    }

    // ----------------------- GAZE FEATURE EXTRACTION -----------------------
    // Four features per eye, all normalized by eye width so they're stable
    // against head distance:
    //   [0] iris x-offset from the eye-corner midpoint (horizontal gaze)
    //   [1] iris y-offset from the eye-corner midpoint (vertical gaze)
    //   [2] iris-to-eyelid balance: closer to the upper or lower lid —
    //       a second, independent vertical-gaze signal
    //   [3] eye openness: lids droop when looking down, widen looking up
    function eyeFeature(lm, eye) {
      const c1 = lm[eye.c1], c2 = lm[eye.c2];
      const w = Math.hypot(c1.x - c2.x, c1.y - c2.y);
      if (w < 1e-6) return null;
      const top = lm[eye.top], bottom = lm[eye.bottom];
      const openness = Math.hypot(top.x - bottom.x, top.y - bottom.y) / w;
      if (openness < BLINK_OPENNESS) return null; // true blink — iris unreliable
      const cx = (c1.x + c2.x) / 2;
      const cy = (c1.y + c2.y) / 2;
      const iris = lm[eye.iris];
      const balance =
        (Math.hypot(iris.x - top.x, iris.y - top.y) -
         Math.hypot(iris.x - bottom.x, iris.y - bottom.y)) / w;
      return [(iris.x - cx) / w, (iris.y - cy) / w, balance, openness];
    }

    // MediaPipe's 8 learned gaze blendshapes, fed to the regression
    // individually (it learns each one's sign and weight itself).
    const GAZE_BLENDSHAPES = [
      "eyeLookInLeft", "eyeLookOutLeft", "eyeLookUpLeft", "eyeLookDownLeft",
      "eyeLookInRight", "eyeLookOutRight", "eyeLookUpRight", "eyeLookDownRight"
    ];
    let blendIdx = null;
    function blendGaze(categories) {
      if (!categories) return new Array(GAZE_BLENDSHAPES.length).fill(0);
      if (!blendIdx) {
        blendIdx = {};
        categories.forEach((c, i) => { blendIdx[c.categoryName] = i; });
      }
      return GAZE_BLENDSHAPES.map((n) => categories[blendIdx[n]]?.score ?? 0);
    }

    // Full gaze feature vector — 22 dimensions:
    //   [0..3]   right-eye iris geometry   [4..7]  left-eye iris geometry
    //   [8..15]  the 8 eyeLook* blendshape scores
    //   [16..21] head pose & position: yaw, pitch, roll, nose x/y,
    //            inter-ocular distance (distance to screen)
    // Head terms are essential: people naturally turn their head partway
    // toward what they look at, so a mapping trained on eyeball rotation
    // alone systematically under-shoots at runtime (the cursor "won't reach
    // the edges"). The regression learns each user's personal head/eye mix.
    function computeGazeFeature(lm, blendshapes) {
      const r = eyeFeature(lm, RIGHT_EYE);
      const l = eyeFeature(lm, LEFT_EYE);
      if (!r && !l) return null;   // both eyes blinking/occluded
      const rr = r ?? l, ll = l ?? r; // wink tolerance: mirror the open eye

      const b = blendGaze(blendshapes);

      const hx = lm[CHEEK_R].z - lm[CHEEK_L].z;   // yaw proxy (depth diff)
      const hy = lm[FOREHEAD].z - lm[CHIN].z;     // pitch proxy (depth diff)
      const outerR = lm[33], outerL = lm[263];    // outer eye corners
      const roll = Math.atan2(outerL.y - outerR.y, outerL.x - outerR.x);
      const iod  = Math.hypot(outerL.x - outerR.x, outerL.y - outerR.y);
      const nose = lm[NOSE_TIP];                  // head position in frame

      return [...rr, ...ll, ...b, hx, hy, roll, nose.x, nose.y, iod];
    }

    // --------------------- CALIBRATION & REGRESSION ---------------------
    // Every sampled frame (not per-dot averages) becomes a training row:
    // ~200+ samples over 9 dots. Features are standardized, expanded with
    // quadratic terms on the four iris offsets (indices 0,1 right / 4,5 left
    // — the terms with real curvature), and ridge-fit per axis.
    const basis = (f) =>
      [1, ...f, f[0] * f[0], f[1] * f[1], f[4] * f[4], f[5] * f[5]];
    const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);

    function solveLinear(A, b) { // Gauss-Jordan with partial pivoting
      const n = b.length;
      const M = A.map((row, i) => [...row, b[i]]);
      for (let col = 0; col < n; col++) {
        let piv = col;
        for (let r = col + 1; r < n; r++)
          if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
        [M[col], M[piv]] = [M[piv], M[col]];
        if (Math.abs(M[col][col]) < 1e-12) throw new Error("Singular calibration matrix");
        for (let r = 0; r < n; r++) {
          if (r === col) continue;
          const f = M[r][col] / M[col][col];
          for (let c = col; c <= n; c++) M[r][c] -= f * M[col][c];
        }
      }
      return M.map((row, i) => row[n] / row[i]);
    }

    function fitMapping(samples) {
      const dim = samples[0].f.length;
      const n = samples.length;

      // Standardize each feature so the ridge penalty treats them equally
      // (iris offsets are ~0.05, blendshape diffs ~1, z-depth diffs ~0.1).
      const mean = new Array(dim).fill(0);
      for (const s of samples)
        for (let i = 0; i < dim; i++) mean[i] += s.f[i] / n;
      const std = new Array(dim).fill(0);
      for (const s of samples)
        for (let i = 0; i < dim; i++) std[i] += (s.f[i] - mean[i]) ** 2 / n;
      for (let i = 0; i < dim; i++) std[i] = Math.max(Math.sqrt(std[i]), 1e-6);
      const norm = (f) => f.map((v, i) => (v - mean[i]) / std[i]);

      const X = samples.map((s) => basis(norm(s.f)));
      const k = X[0].length;
      const lambda = 1e-3 * n; // mild ridge; keeps collinear features stable
      const AtA = Array.from({ length: k }, () => new Array(k).fill(0));
      for (const row of X)
        for (let i = 0; i < k; i++)
          for (let j = 0; j < k; j++) AtA[i][j] += row[i] * row[j];
      for (let i = 1; i < k; i++) AtA[i][i] += lambda; // don't penalize the bias

      const fitAxis = (axis) => {
        const Atb = new Array(k).fill(0);
        samples.forEach((s, r) => {
          for (let i = 0; i < k; i++) Atb[i] += X[r][i] * s.t[axis];
        });
        return solveLinear(AtA, Atb);
      };
      const coefX = fitAxis(0);
      const coefY = fitAxis(1);

      let se = 0;
      samples.forEach((s, r) => {
        se += (dot(X[r], coefX) - s.t[0]) ** 2 + (dot(X[r], coefY) - s.t[1]) ** 2;
      });
      return { mean, std, coefX, coefY, rms: Math.sqrt(se / n) };
    }

    function waitForTap() {
      return new Promise((resolve) => {
        // Small delay so the tap that advanced the previous step (or opened
        // calibration) can't double-fire into this one.
        setTimeout(() => {
          document.addEventListener("pointerdown", resolve, { once: true });
        }, 350);
      });
    }

    async function runCalibration() {
      mode = "calibrating";
      calBtn.classList.remove("visible");
      recalBtn.classList.remove("visible");
      modeToggle.classList.remove("visible");
      handsBtn.classList.remove("visible");
      threeDBtn.classList.remove("visible");
      avatarBtn.classList.remove("visible");
      reachBtn.classList.remove("visible");
      targetsEl.classList.remove("visible");
      gazeCursor.style.display = "none";
      cal = null;
      smoothed = null;

      const samples = [];
      let i = 0;
      while (i < CAL_POINTS.length) {
        const [nx, ny] = CAL_POINTS[i];
        calTarget.style.display = "block";
        calTarget.classList.remove("sampling");
        calTarget.style.transform = ""; // let the pulse animation own transform
        calTarget.style.left = `${nx * 100}vw`;
        calTarget.style.top  = `${ny * 100}vh`;
        const hint = useHeadFeatures ? "" : " — keep your head still";
        setStatus(`Look at the yellow dot, then tap anywhere (${i + 1}/${CAL_POINTS.length})${hint}`);

        await waitForTap();

        // Keep looking at the dot: let the tap-jiggle settle, then sample
        // gaze features for ~1s. Every frame becomes a training sample.
        calTarget.classList.add("sampling");
        await delay(SETTLE_MS);
        sampleBuf = [];
        await delay(SAMPLE_MS);
        const buf = sampleBuf;
        sampleBuf = null;

        if (buf.length < MIN_SAMPLES) {
          setStatus("Face lost during sampling — let's redo that dot.");
          await delay(1200);
          continue; // retry the same point
        }
        for (const f of buf)
          samples.push({ f: useHeadFeatures ? f : f.slice(0, HEAD_START), t: [nx, ny] });
        i++;
      }

      calTarget.style.display = "none";
      try {
        cal = { ...fitMapping(samples), useHead: useHeadFeatures };
      } catch (err) {
        console.error("[Eyeball] Calibration fit failed:", err);
        setStatus("Calibration failed — please try again.", true);
        mode = "preview";
        calBtn.classList.add("visible");
        modeToggle.classList.add("visible");
        handsBtn.classList.add("visible");
        threeDBtn.classList.add("visible");
        avatarBtn.classList.add("visible");
        reachBtn.classList.add("visible");
        return;
      }
      console.log(
        `[Eyeball] Calibration complete: ${samples.length} samples, ` +
        `training fit error ≈ ${(cal.rms * 100).toFixed(1)}% of screen`,
        cal
      );

      enterGazeMode();
    }

    // --------------------------- LOOK & TAP ---------------------------
    function buildTiles() {
      sceneEl.innerHTML = "";
      tileEls = TILES.map(([emoji, label]) => {
        const el = document.createElement("div");
        el.className = "tile";
        el.innerHTML = `<span class="emoji">${emoji}</span><span>${label}</span>`;
        el.dataset.label = label;
        sceneEl.appendChild(el);
        return el;
      });
    }

    // Head-coupled window: the scene is NEVER rotated — a real window doesn't
    // turn to face you. Only the perspective-origin (the viewer's eye
    // position) follows the tracked head, approximating an off-axis
    // projection.
    //
    // The reference point is the NECK PIVOT (top of the neck, under the chin),
    // NOT the face centre. The facial transformation matrix gives the face
    // centre's pose [R | t]; the neck pivot sits at a fixed head-local offset
    // p = (0, -down, -back) from it, so its camera-space position is
    //   pivot = R·p + t.
    // Because the head physically rotates ABOUT this pivot, R and t change
    // together to keep R·p + t constant under pure rotation — so turning your
    // head in place does NOT move the scene. Only translating your body (which
    // moves the pivot) shifts it. Tune pivotDown/pivotBack until head turns
    // produce zero drift.
    function updateParallax(lm, mat) {
      if (!threeD) return;

      let hx, hy, dist;
      if (mat && mat.length === 16) {
        // Column-major 4x4: rotation in columns 0-2, translation in column 3.
        // Head-local offset to the neck pivot: down = -Y, back = -Z.
        const px = 0, py = -params.pivotDown, pz = -params.pivotBack;
        const rx = mat[0] * px + mat[4] * py + mat[8]  * pz;
        const ry = mat[1] * px + mat[5] * py + mat[9]  * pz;
        const rz = mat[2] * px + mat[6] * py + mat[10] * pz;
        const cx = mat[12] + rx, cy = mat[13] + ry, cz = mat[14] + rz;
        hx = -cx;             // mirrored display: user-right → CSS-right
        hy = -cy;             // camera Y-up → CSS y-down
        dist = Math.abs(cz);
      } else {
        // Fallback if the matrix is unavailable: nose position (rotation-
        // sensitive, but better than nothing).
        const nose = lm[NOSE_TIP];
        hx = (1 - nose.x) * 30;
        hy = nose.y * 30;
        const outerR = lm[33], outerL = lm[263];
        dist = 5 / Math.max(1e-6,
          Math.hypot(outerL.x - outerR.x, outerL.y - outerR.y));
      }

      const a = params.smooth;
      headSmooth = headSmooth
        ? headSmooth.map((v, i) => v + ([hx, hy, dist][i] - v) * a)
        : [hx, hy, dist];
      if (!headBaseline) headBaseline = [...headSmooth];

      // Head-coupled off-axis shift, mapped for a REALISTIC, bounded feel.
      // A head move of REACH_CM reaches the shift limit (20% of the screen) at
      // intensity 1×, and the result is CLAMPED — so a small move gives a small
      // shift and a big move saturates gently, instead of a tiny lean throwing
      // the view to the far side of the room. Intensity scales the sensitivity.
      const iw = window.innerWidth, ih = window.innerHeight;
      const maxSX = 0.20 * iw, maxSY = 0.20 * ih;
      const dx = headSmooth[0] - headBaseline[0];
      const dy = headSmooth[1] - headBaseline[1];
      const ddist = headBaseline[2] - headSmooth[2];
      const ox = Math.max(-maxSX, Math.min(maxSX, dx * (maxSX / REACH_CM) * params.intensity));
      const oy = Math.max(-maxSY, Math.min(maxSY, dy * (maxSY / REACH_CM) * params.intensity));
      targetsEl.style.perspectiveOrigin = `${Math.round(iw / 2 + ox)}px ${Math.round(ih / 2 + oy)}px`;

      // Lean in → dolly a little way down the corridor; clamped and gentle.
      // Only written when it actually changes (fewer style recalcs → smoother).
      const depthPx = corridorDepthPx();
      const dz = Math.max(-0.5 * depthPx, Math.min(0.85 * depthPx,
        ddist * 8 * params.intensity));
      const dolly = `translateZ(${Math.round(dz)}px)`;
      if (dolly !== lastDolly) {
        sceneEl.style.transform = dolly;
        roomEl.style.transform = dolly;
        lastDolly = dolly;
      }

      // Throttle the read-out: per-frame DOM text writes under GPU load were
      // part of what starved the panel's compositor layer (black/unclickable).
      if (settingsPanel.classList.contains("visible") && frameCount % 6 === 0) {
        readoutEl.textContent =
          `move x ${dx.toFixed(1)}  y ${dy.toFixed(1)} cm   lean ${ddist.toFixed(1)}\n` +
          `dist ${headSmooth[2].toFixed(1)} cm   shift ${Math.round(ox)},${Math.round(oy)} px`;
      }
    }

    // Depth rings — nested frames receding down the corridor for strong
    // parallax/tunnel cues. Regenerated when the depth slider changes.
    function buildRings() {
      const ringsEl = document.getElementById("rings");
      ringsEl.innerHTML = "";
      const depth = corridorDepthPx();
      const n = 9;
      for (let i = 1; i <= n; i++) {
        const r = document.createElement("div");
        r.className = "ring";
        r.style.transform = `translateZ(${(-depth * i / n).toFixed(0)}px)`;
        ringsEl.appendChild(r);
      }
    }
    function applyRoomScale() {
      roomEl.style.setProperty("--depth", `${corridorDepthPx().toFixed(0)}px`);
      buildRings();
    }

    // ---------------------- AVATAR (skeleton → 3D figure) ----------------------
    // MediaPipe Pose gives 33 landmarks. These bone pairs connect them into a
    // body; joints get spheres, bones get capsules. Indices: 11/12 shoulders,
    // 13/14 elbows, 15/16 wrists, 23/24 hips, 25/26 knees, 27/28 ankles, 0 nose.
    const POSE_BONES = [
      [11, 12], [11, 23], [12, 24], [23, 24],   // shoulders, torso sides, hips
      [11, 13], [13, 15],                        // left arm
      [12, 14], [14, 16],                        // right arm
      [23, 25], [25, 27],                        // left leg
      [24, 26], [26, 28]                         // right leg
    ];
    const POSE_JOINTS = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];
    const AV_SCALE = 3.6; // world-metres → scene units, tuned to fill the view

    async function buildAvatarScene() {
      const renderer = new THREE.WebGLRenderer({ canvas: avatarCanvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x04120a);
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      camera.position.set(0, 0, 8);
      scene.add(new THREE.AmbientLight(0x88ffcc, 0.6));
      const key = new THREE.DirectionalLight(0xffffff, 1.1);
      key.position.set(2, 4, 5);
      scene.add(key);
      const group = new THREE.Group();
      group.position.y = 0.5; // hips sit near y=0; nudge up so the figure centres
      scene.add(group);

      const boneMat = new THREE.MeshStandardMaterial(
        { color: 0x00e58c, roughness: 0.35, metalness: 0.2, emissive: 0x003b25 });
      const jointMat = new THREE.MeshStandardMaterial(
        { color: 0xff7ad9, roughness: 0.3, emissive: 0x3a0026 });
      const headMat = new THREE.MeshStandardMaterial(
        { color: 0xaef7d6, roughness: 0.4, emissive: 0x0a3a26 });

      const bones = POSE_BONES.map(() => {
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1, 14), boneMat);
        group.add(m); return m;
      });
      const joints = POSE_JOINTS.map((idx) => {
        const r = idx === 0 ? 0.42 : 0.18;
        const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 16),
          idx === 0 ? headMat : jointMat);
        group.add(m); return m;
      });

      avatarRig = { renderer, scene, camera, group, bones, joints,
        up: new THREE.Vector3(0, 1, 0), a: new THREE.Vector3(),
        b: new THREE.Vector3(), mid: new THREE.Vector3(),
        dir: new THREE.Vector3(), q: new THREE.Quaternion() };
      resizeAvatar();
      // Test hook: lets an automated check drive the rig with a synthetic pose
      // (harmless in normal use).
      window.__avatarTest = (w) => updateAvatar(w);
    }

    function resizeAvatar() {
      if (!avatarRig) return;
      const w = avatarCanvas.clientWidth || window.innerWidth;
      const h = avatarCanvas.clientHeight || window.innerHeight;
      avatarRig.renderer.setSize(w, h, false);
      avatarRig.camera.aspect = w / h;
      avatarRig.camera.updateProjectionMatrix();
    }

    // Orient a unit cylinder (default axis +Y) to span points a→b.
    function setBone(mesh, a, b) {
      const R = avatarRig;
      R.a.set(a[0], a[1], a[2]);
      R.b.set(b[0], b[1], b[2]);
      R.mid.addVectors(R.a, R.b).multiplyScalar(0.5);
      R.dir.subVectors(R.b, R.a);
      const len = R.dir.length() || 1e-4;
      mesh.position.copy(R.mid);
      mesh.scale.set(1, len, 1);
      R.q.setFromUnitVectors(R.up, R.dir.normalize());
      mesh.quaternion.copy(R.q);
    }

    // Map a pose WORLD landmark (metres, hip-centred) to scene space. Mirror x
    // for the selfie view; negate y (image y-down → scene y-up); scale.
    function worldPt(l) {
      return [-l.x * AV_SCALE, -l.y * AV_SCALE, -l.z * AV_SCALE];
    }

    function updateAvatar(world) {
      if (!avatarRig || !world) return;
      // EMA-smooth each landmark to tame jitter.
      for (let i = 0; i < world.length; i++) {
        const p = worldPt(world[i]);
        const s = poseSmooth[i] || (poseSmooth[i] = p.slice());
        for (let k = 0; k < 3; k++) s[k] += (p[k] - s[k]) * 0.45;
      }
      POSE_BONES.forEach((c, i) => {
        const a = poseSmooth[c[0]], b = poseSmooth[c[1]];
        if (a && b) setBone(avatarRig.bones[i], a, b);
      });
      POSE_JOINTS.forEach((idx, i) => {
        const p = poseSmooth[idx];
        if (p) avatarRig.joints[i].position.set(p[0], p[1], p[2]);
      });
      avatarRig.renderer.render(avatarRig.scene, avatarRig.camera);
    }

    // ---------------------- REACH (grab 3D objects, first-person) ----------------------
    async function buildReachScene() {
      const renderer = new THREE.WebGLRenderer({ canvas: reachCanvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x06140d, 1); // opaque dark stage — camera feed hidden
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
      camera.position.set(0, 0, 5);
      scene.add(new THREE.AmbientLight(0xffffff, 0.75));
      const key = new THREE.DirectionalLight(0xffffff, 1.0);
      key.position.set(2, 3, 4);
      scene.add(key);

      const geoms = [
        new THREE.IcosahedronGeometry(0.5, 0),
        new THREE.BoxGeometry(0.7, 0.7, 0.7),
        new THREE.TorusGeometry(0.4, 0.16, 14, 28),
        new THREE.DodecahedronGeometry(0.52),
        new THREE.ConeGeometry(0.45, 0.85, 22)
      ];
      const colors = [0x00e5ff, 0xff7ad9, 0xffd93d, 0x8aff80, 0xb98cff];
      const objects = geoms.map((g, i) => {
        const mat = new THREE.MeshStandardMaterial({
          color: colors[i], emissive: colors[i], emissiveIntensity: 0.25,
          roughness: 0.3, metalness: 0.35
        });
        const m = new THREE.Mesh(g, mat);
        const hx = (i / (geoms.length - 1) - 0.5) * 4.6;
        const hy = i % 2 ? 0.8 : -0.8;
        m.position.set(hx, hy, 0);
        m.userData = { home: new THREE.Vector3(hx, hy, 0), phase: i * 1.3,
          spin: 0.006 + i * 0.002, grabbedBy: -1, vel: new THREE.Vector3() };
        scene.add(m);
        return m;
      });

      // Two solid, skin-toned 3D hands, built once and posed per frame from
      // the landmarks: rounded knuckles (spheres), chunky finger segments
      // (capsules), and a filled palm pad — an avatar hand, not a skeleton.
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xe3ac8b, emissive: 0x2a1408, emissiveIntensity: 0.35, roughness: 0.65, metalness: 0.05 });
      const skinTip = new THREE.MeshStandardMaterial({ color: 0xe8b89a, emissive: 0x2a1408, emissiveIntensity: 0.35, roughness: 0.6 });
      const capsule = (r, len) => (THREE.CapsuleGeometry
        ? new THREE.CapsuleGeometry(r, len, 4, 10)
        : new THREE.CylinderGeometry(r, r, len, 12));
      const hands3d = [0, 1].map(() => {
        const g = new THREE.Group();
        g.visible = false;
        scene.add(g);
        const joints = Array.from({ length: 21 }, (_, i) => {
          const tip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
          const r = i === 0 ? 0.08 : (tip ? 0.05 : 0.048);
          const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), tip ? skinTip : skinMat);
          g.add(m); return m;
        });
        // Palm-crossing connectors ([0,5],[5,9],[9,13],[13,17],[0,17]) are
        // covered by the palm pad, so draw them thin; finger segments a touch
        // thicker. Keeps the hand from looking like balloon animals.
        const PALM_BONES = new Set([4, 8, 12, 16, 20]); // indices into HAND_BONES
        const bones = HAND_BONES.map((_, i) => {
          const r = PALM_BONES.has(i) ? 0.02 : 0.038;
          const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 10), skinMat);
          g.add(m); return m;
        });
        const palm = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 14), skinMat);
        g.add(palm);
        return { group: g, joints, bones, palm };
      });

      reachRig = { renderer, scene, camera, objects, hands3d,
        raycaster: new THREE.Raycaster(), ndc: new THREE.Vector2(),
        proj: new THREE.Vector3(), t: 0,
        bounds: [2.7, 1.8, 1.2], // x/y/z half-extents the objects bounce inside
        grab: [{ obj: null }, { obj: null }], handZ: [null, null],
        htmp: new THREE.Vector2(), bmid: new THREE.Vector3(),
        bdir: new THREE.Vector3(), bup: new THREE.Vector3(0, 1, 0),
        bq: new THREE.Quaternion() };
      resizeReach();
      window.__reachTest = (hands, worlds) => updateReach({ landmarks: hands, worldLandmarks: worlds });
      window.__reachDump = () => reachRig.objects.map((o) =>
        ({ x: +o.position.x.toFixed(2), y: +o.position.y.toFixed(2), grabbedBy: o.userData.grabbedBy }));
      window.__reachProject = (i) => {
        const v = reachRig.objects[i].position.clone().project(reachRig.camera);
        return { ndcX: v.x, ndcY: v.y }; // → image coords: mx=(ndcX+1)/2, my=(1-ndcY)/2
      };
      window.__reachHandsVisible = () => reachRig.hands3d.map((h) => h.group.visible);
      window.__reachHandInfo = () => {
        const r = reachRig.hands3d[0];
        const j = (i) => { const p = r.joints[i].position; return [+p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2)]; };
        const ps = r.palm.scale;
        return { wrist: j(0), indexTip: j(8), midTip: j(12),
          palm: [+r.palm.position.x.toFixed(2), +r.palm.position.y.toFixed(2), +r.palm.position.z.toFixed(2)],
          palmScale: [+ps.x.toFixed(2), +ps.y.toFixed(2), +ps.z.toFixed(2)] };
      };
      window.__reachInspect = () => {
        const o = reachRig.objects.find((x) => x.userData.grabbedBy >= 0) || reachRig.objects[0];
        o.updateMatrixWorld(true);
        const s = new THREE.Vector3();
        o.matrixWorld.decompose(new THREE.Vector3(), new THREE.Quaternion(), s);
        return { qlen: +o.quaternion.length().toFixed(4),
          scale: [+s.x.toFixed(3), +s.y.toFixed(3), +s.z.toFixed(3)] };
      };
    }

    function resizeReach() {
      if (!reachRig) return;
      const w = reachCanvas.clientWidth || window.innerWidth;
      const h = reachCanvas.clientHeight || window.innerHeight;
      reachRig.renderer.setSize(w, h, false);
      reachRig.camera.aspect = w / h;
      reachRig.camera.updateProjectionMatrix();
    }

    // Pinch closedness: thumb-tip↔index-tip distance over hand size.
    const pinchRatio = (hand) =>
      Math.hypot(hand[4].x - hand[8].x, hand[4].y - hand[8].y) /
      (Math.hypot(hand[0].x - hand[9].x, hand[0].y - hand[9].y) || 1);

    // Hand orientation as a quaternion, so a held object turns WITH the hand.
    // First-person (un-mirrored) right-handed screen basis: x = image-right,
    // y = up, z = toward viewer. The basis is built xA = yA×zA then
    // zA = xA×yA so it is ALWAYS orthonormal and right-handed (det +1) — i.e.
    // a pure rotation. (A left-handed/reflection basis fed to
    // setFromRotationMatrix is what was shearing/squashing the held mesh.)
    function handQuaternion(hand) {
      // Flip x and z together (a proper rotation, not a reflection) so the hand
      // keeps its chirality. reachMirror picks which horizontal convention.
      const sx = reachMirror ? -1 : 1, off = reachMirror ? 1 : 0;
      const P = (i) => new THREE.Vector3(
        off + sx * hand[i].x, -hand[i].y, sx * (hand[i].z || 0) * 2);
      const yA = P(9).sub(P(0));            // wrist → middle knuckle = "up"
      if (yA.lengthSq() < 1e-8) return new THREE.Quaternion();
      yA.normalize();
      const across = P(8).sub(P(4));        // thumb → index
      let zA = new THREE.Vector3().crossVectors(across, yA);
      if (zA.lengthSq() < 1e-8) zA.set(0, 0, 1); else zA.normalize();
      const xA = new THREE.Vector3().crossVectors(yA, zA).normalize();
      zA.crossVectors(xA, yA).normalize();  // re-orthogonalise → right-handed
      return new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().makeBasis(xA, yA, zA));
    }

    // Standard 21-point hand skeleton bone pairs.
    const HAND_BONES = [
      [0,1],[1,2],[2,3],[3,4],        // thumb
      [0,5],[5,6],[6,7],[7,8],        // index
      [5,9],[9,10],[10,11],[11,12],   // middle
      [9,13],[13,14],[14,15],[15,16], // ring
      [13,17],[17,18],[18,19],[19,20],// pinky
      [0,17]                          // palm base
    ];

    // Screen NDC → a world point on the plane z = depth (camera ray intersect).
    function rayWorld(R, ndc, depth) {
      R.raycaster.setFromCamera(ndc, R.camera);
      const ro = R.raycaster.ray.origin, rd = R.raycaster.ray.direction;
      const t = (depth - ro.z) / rd.z;
      return new THREE.Vector3(ro.x + rd.x * t, ro.y + rd.y * t, depth);
    }
    const pinchWorld = (R, depth) => rayWorld(R, R.ndc, depth);

    // Orient a unit cylinder to span a→b (reach rig temps).
    function setBoneMesh(R, mesh, a, b) {
      R.bmid.addVectors(a, b).multiplyScalar(0.5);
      R.bdir.subVectors(b, a);
      const len = R.bdir.length() || 1e-4;
      mesh.position.copy(R.bmid);
      mesh.scale.set(1, len, 1);
      R.bq.setFromUnitVectors(R.bup, R.bdir.clone().normalize());
      mesh.quaternion.copy(R.bq);
    }

    // Position a 3D hand rig from the 21 landmarks. Joints are placed on a
    // plane in front of the objects (so hands reach IN toward them), with a
    // per-landmark z wobble for finger articulation. x uses image x directly
    // (first-person, un-mirrored) so the visual hand aligns with the grab point.
    const HAND_ZBASE = 0.9;
    const HAND_WSCALE = 12; // world-landmark metres → scene units
    // Depth from apparent hand size (wrist→knuckle span in the image): a bigger
    // hand is closer to the camera = reaching further forward, which in this
    // stepped-through view pushes DEEPER into the scene (toward/past the
    // objects). Smaller = pulled back toward the window.
    const SIZE_NEAR = 0.28, SIZE_FAR = 0.07; // screen span when close / far
    const Z_NEAR = 2.0, Z_DEEP = -3.4;       // depth toward viewer / into scene
    function handDepth(hand) {
      // Average two spans (wrist→mid-knuckle and index→pinky knuckle) for a
      // steadier size estimate, less thrown off by wrist tilt.
      const s1 = Math.hypot(hand[0].x - hand[9].x, hand[0].y - hand[9].y);
      const s2 = Math.hypot(hand[5].x - hand[17].x, hand[5].y - hand[17].y) * 1.6;
      const s = (s1 + s2) / 2;
      const f = Math.max(0, Math.min(1, (s - SIZE_FAR) / (SIZE_NEAR - SIZE_FAR)));
      return Z_NEAR + f * (Z_DEEP - Z_NEAR);
    }
    function updateHand3D(R, rig, hand, world, zBase) {
      if (!hand) { rig.group.visible = false; return; }
      rig.group.visible = true;
      const z0 = zBase ?? HAND_ZBASE;

      let pts;
      if (world && world.length === 21) {
        // STEP-THROUGH: use the hand's real 3D shape (world landmarks) and turn
        // it 180° about the vertical axis — as if you stepped through the
        // screen and now face away — so palm-toward-camera becomes palm-into-
        // scene, while your right hand stays a right hand. The sign pair keeps
        // it a PROPER rotation (chirality preserved); the flip toggle swaps
        // which 180° so you can land on "stepped through" vs "mirror".
        const sx = reachMirror ? -1 : 1, sz = reachMirror ? 1 : -1;
        let cx = 0, cy = 0;
        for (const lm of hand) { cx += lm.x; cy += lm.y; }
        cx /= hand.length; cy /= hand.length;
        const nx = reachMirror ? (1 - cx) : cx;
        R.htmp.set(nx * 2 - 1, -(cy * 2 - 1));
        const center = rayWorld(R, R.htmp, z0); // z0 = depth from hand size
        pts = world.map((w) => new THREE.Vector3(
          center.x + sx * w.x * HAND_WSCALE,
          center.y - w.y * HAND_WSCALE,
          center.z + sz * w.z * HAND_WSCALE));
      } else {
        // Fallback (no world landmarks): flat screen landmarks.
        const zs = reachMirror ? 1 : -1;
        pts = hand.map((lm) => {
          const nx = reachMirror ? (1 - lm.x) : lm.x;
          R.htmp.set(nx * 2 - 1, -(lm.y * 2 - 1));
          const p = rayWorld(R, R.htmp, z0);
          p.z += zs * (lm.z || 0) * 6;
          return p;
        });
      }
      for (let i = 0; i < 21; i++) rig.joints[i].position.copy(pts[i]);
      HAND_BONES.forEach((c, i) => setBoneMesh(R, rig.bones[i], pts[c[0]], pts[c[1]]));

      // Palm pad: an ellipsoid at the palm centroid, oriented to the hand and
      // flattened, filling the space between wrist and knuckles.
      const palm = rig.palm;
      palm.position.copy(pts[0]).add(pts[5]).add(pts[9]).add(pts[13]).add(pts[17]).multiplyScalar(1 / 5);
      const up = R.bmid.subVectors(pts[9], pts[0]);      // wrist → middle knuckle
      const across = R.bdir.subVectors(pts[5], pts[17]);  // index → pinky knuckle
      const width = across.length() * 0.5;
      const height = up.length() * 0.62;
      let n = new THREE.Vector3().crossVectors(up, across);
      if (n.lengthSq() < 1e-8) n.set(0, 0, 1); else n.normalize();
      const yA = up.clone().normalize();
      const xA = new THREE.Vector3().crossVectors(yA, n).normalize();
      const zA = new THREE.Vector3().crossVectors(xA, yA).normalize();
      palm.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, yA, zA));
      palm.scale.set(Math.max(width, 0.05), Math.max(height, 0.05), 0.1);
    }

    function updateReach(handResult) {
      const R = reachRig;
      if (!R) return;
      R.t += 1;
      const hands = handResult?.landmarks ?? [];
      const worlds = handResult?.worldLandmarks ?? [];

      for (let h = 0; h < 2; h++) {
        const hand = hands[h];
        const grab = R.grab[h];
        if (!hand) { // hand left frame → let go (keeps any throw velocity)
          updateHand3D(R, R.hands3d[h], null);
          if (grab.obj) { grab.obj.userData.grabbedBy = -1; grab.obj = null; }
          continue;
        }
        // Depth from apparent hand size, smoothed per hand → reaching forward
        // pushes the hand (and anything it holds) deeper into the scene.
        const rawZ = handDepth(hand);
        if (R.handZ[h] == null) {
          R.handZ[h] = rawZ;
        } else {
          // Speed-adaptive: snappy on deliberate reaches, steady when held.
          const a = Math.min(0.65, 0.16 + Math.abs(rawZ - R.handZ[h]) * 0.28);
          R.handZ[h] += (rawZ - R.handZ[h]) * a;
        }
        const zBase = R.handZ[h];
        updateHand3D(R, R.hands3d[h], hand, worlds[h], zBase);
        const isPinch = grab.obj ? pinchRatio(hand) < 0.42 : pinchRatio(hand) < 0.26;

        // Pinch midpoint → NDC, using the same horizontal convention as the
        // rendered hand so the grab point stays under the visible fingers.
        const mx = (hand[4].x + hand[8].x) / 2, my = (hand[4].y + hand[8].y) / 2;
        const nmx = reachMirror ? (1 - mx) : mx;
        R.ndc.set(nmx * 2 - 1, -(my * 2 - 1));
        const handQ = handQuaternion(hand);

        if (isPinch && !grab.obj) {
          // Grab the nearest free object to the pinch on screen.
          let best = null, bestD = 0.16;
          for (const o of R.objects) {
            if (o.userData.grabbedBy >= 0) continue;
            R.proj.copy(o.position).project(R.camera);
            const d = Math.hypot(R.proj.x - R.ndc.x, R.proj.y - R.ndc.y);
            if (d < bestD) { bestD = d; best = o; }
          }
          if (best) {
            grab.obj = best;
            best.userData.grabbedBy = h;
            best.userData.vel.set(0, 0, 0);
            const pw = pinchWorld(R, zBase); // grab at the hand's current depth
            // Preserve WHERE on the object you pinched, in hand-local space
            // (incl. its depth offset), so it doesn't teleport to your fingers…
            grab.offset = best.position.clone().sub(pw)
              .applyQuaternion(handQ.clone().invert());
            // …and preserve its orientation relative to the hand.
            grab.qOffset = handQ.clone().invert().multiply(best.quaternion);
            grab.prev = best.position.clone();
          }
        }

        if (grab.obj && isPinch) {
          const o = grab.obj;
          const target = pinchWorld(R, zBase)  // follows the hand in depth too
            .add(grab.offset.clone().applyQuaternion(handQ)); // orbit with hand
          grab.prev.copy(o.position);
          o.position.lerp(target, 0.5);                       // spring → weight
          o.userData.vel.copy(o.position).sub(grab.prev);     // for throw
          o.quaternion.copy(handQ).multiply(grab.qOffset);    // turn with hand
          o.material.emissiveIntensity += (0.85 - o.material.emissiveIntensity) * 0.2;
          o.scale.setScalar(o.scale.x + (1.12 - o.scale.x) * 0.2);
        }

        if (!isPinch && grab.obj) { // release → object keeps its velocity
          grab.obj.userData.grabbedBy = -1;
          grab.obj = null;
        }
      }

      // Free-object physics: momentum from a throw, air drag, a gentle pull
      // home, and a bounce off the invisible walls.
      const [bx, by, bz] = R.bounds;
      for (const o of R.objects) {
        if (o.userData.grabbedBy >= 0) continue;
        const v = o.userData.vel, p = o.position, home = o.userData.home;
        v.x += (home.x - p.x) * 0.003;
        v.y += (home.y - p.y) * 0.003;
        v.z += (home.z - p.z) * 0.003;
        v.multiplyScalar(0.94);
        p.add(v);
        if (p.x > bx) { p.x = bx; v.x *= -0.6; } else if (p.x < -bx) { p.x = -bx; v.x *= -0.6; }
        if (p.y > by) { p.y = by; v.y *= -0.6; } else if (p.y < -by) { p.y = -by; v.y *= -0.6; }
        if (p.z > bz) { p.z = bz; v.z *= -0.6; } else if (p.z < -bz) { p.z = -bz; v.z *= -0.6; }
        o.rotation.x += o.userData.spin;
        o.rotation.y += o.userData.spin * 1.3;
        o.material.emissiveIntensity += (0.25 - o.material.emissiveIntensity) * 0.1;
        o.scale.setScalar(o.scale.x + (1 - o.scale.x) * 0.1);
      }
      R.renderer.render(R.scene, R.camera);
    }

    function enterGazeMode() {
      mode = "gaze";
      targetsEl.classList.add("visible");
      gazeCursor.style.display = "block";
      recalBtn.classList.add("visible");
      modeToggle.classList.add("visible");
      handsBtn.classList.add("visible");
      threeDBtn.classList.add("visible");
      avatarBtn.classList.add("visible");
      reachBtn.classList.add("visible");
      const quality = cal && cal.rms < 0.06 ? "good" : "rough — consider recalibrating";
      setStatus(`Calibrated (fit: ${quality}). Look at a tile, tap ANYWHERE to select.`);
    }

    function hitTile(px, py) {
      for (const el of tileEls) {
        const r = el.getBoundingClientRect();
        if (px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return el;
      }
      return null;
    }

    function activateTile(el, verb) {
      el.classList.remove("activated");
      void el.offsetWidth; // restart the CSS animation
      el.classList.add("activated");
      setStatus(`✔ ${verb}: ${el.dataset.label}`);
      console.log(`[Eyeball] ${verb}: ${el.dataset.label}`);
      if (navigator.vibrate) navigator.vibrate(30);
    }

    // Map a normalized video coordinate to screen pixels, accounting for the
    // object-fit: cover crop and the CSS mirror — needed to hit-test DOM
    // tiles against a fingertip tracked in video space.
    function videoToScreen(nx, ny) {
      const vw = window.innerWidth, vh = window.innerHeight;
      const scale = Math.max(vw / canvas.width, vh / canvas.height);
      const dw = canvas.width * scale, dh = canvas.height * scale;
      return [(vw - dw) / 2 + (1 - nx) * dw, (vh - dh) / 2 + ny * dh];
    }

    function updateGaze(feature) {
      if (!feature || !cal) return;
      const f = cal.useHead ? feature : feature.slice(0, HEAD_START);
      const b = basis(f.map((v, i) => (v - cal.mean[i]) / cal.std[i]));
      let gx = dot(b, cal.coefX);
      let gy = dot(b, cal.coefY);
      if (!Number.isFinite(gx) || !Number.isFinite(gy)) return;
      gx = Math.min(1, Math.max(0, gx));
      gy = Math.min(1, Math.max(0, gy));

      if (!smoothed) {
        smoothed = [gx, gy];
      } else {
        // Speed-adaptive smoothing: heavy filtering while fixating (steady
        // cursor), light filtering during saccades (fast catch-up, no lag).
        const a = Math.min(0.8,
          0.12 + Math.hypot(gx - smoothed[0], gy - smoothed[1]) * 5);
        smoothed = [smoothed[0] + (gx - smoothed[0]) * a,
                    smoothed[1] + (gy - smoothed[1]) * a];
      }

      const px = smoothed[0] * window.innerWidth;
      const py = smoothed[1] * window.innerHeight;
      gazeCursor.style.transform = `translate3d(${px}px, ${py}px, 0)`;

      // Highlight the tile under the gaze point.
      const hit = hitTile(px, py);
      if (hit !== lookedTile) {
        lookedTile?.classList.remove("looked");
        hit?.classList.add("looked");
        lookedTile = hit;
      }
    }

    // Look chooses, tap confirms: any tap activates whichever tile the user
    // is currently looking at.
    document.addEventListener("pointerdown", (e) => {
      if (mode !== "gaze") return;
      if (e.target === recalBtn) return;
      if (lookedTile) {
        activateTile(lookedTile, "Selected");
      } else {
        setStatus("No tile under gaze — look at a tile, then tap.");
      }
    });

    // ----------------- DETECTION LOOP + VISUALIZATION -----------------
    function drawIrisDot(landmark, ringIndices, landmarks) {
      const x = landmark.x * canvas.width;
      const y = landmark.y * canvas.height;

      // Estimate iris radius from the ring landmarks so the marker scales
      // with distance from the camera.
      let radius = 4;
      if (ringIndices.length) {
        let sum = 0;
        for (const i of ringIndices) {
          const dx = (landmarks[i].x - landmark.x) * canvas.width;
          const dy = (landmarks[i].y - landmark.y) * canvas.height;
          sum += Math.hypot(dx, dy);
        }
        radius = Math.max(3, sum / ringIndices.length);
      }

      // High-contrast marker: bright green fill, dark outline, crosshair dot.
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "#00FF44";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = "#00FF44";
      ctx.strokeStyle = "rgba(0,0,0,0.8)";
      ctx.lineWidth = 1.5;
      ctx.fill();
      ctx.stroke();
    }

    function renderLoop() {
      // Only run inference when a NEW frame is available; on mobile the
      // camera is often 30fps while rAF runs at 60fps — detecting the same
      // frame twice wastes battery and can confuse the VIDEO-mode timestamp
      // requirement (timestamps must be monotonically increasing).
      if (video.currentTime !== lastVideoTime && video.videoWidth > 0) {
        lastVideoTime = video.currentTime;

        let result;
        try {
          result = faceLandmarker.detectForVideo(video, performance.now());
        } catch (err) {
          console.error("[Eyeball] detectForVideo failed:", err);
          result = null;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (result?.faceLandmarks?.length) {
          // 478 normalized 3D landmarks (x, y in [0,1]; z = relative depth).
          const landmarks = result.faceLandmarks[0];

          // Wireframe face mesh while calibrating — visual confirmation that
          // tracking is solid on every dot (and it looks great).
          if (mode === "calibrating") {
            drawingUtils.drawConnectors(
              landmarks,
              FaceLandmarker.FACE_LANDMARKS_TESSELATION,
              { color: "rgba(0, 255, 140, 0.25)", lineWidth: 0.6 }
            );
          }

          const rightIris = landmarks[RIGHT_IRIS_CENTER];
          const leftIris  = landmarks[LEFT_IRIS_CENTER];

          drawIrisDot(rightIris, RIGHT_IRIS_RING, landmarks);
          drawIrisDot(leftIris,  LEFT_IRIS_RING,  landmarks);

          updateParallax(landmarks, result.facialTransformationMatrixes?.[0]?.data);

          const feature = computeGazeFeature(
            landmarks,
            result.faceBlendshapes?.[0]?.categories
          );
          if (feature) {
            latestFeature = feature;
            if (sampleBuf) sampleBuf.push(feature);
            if (mode === "gaze") updateGaze(feature);
          }

          frameCount++;
          if (frameCount % 60 === 0) {
            console.log(
              `[Eyeball] Right iris center — ` +
              `normalized: (${rightIris.x.toFixed(4)}, ${rightIris.y.toFixed(4)}) | ` +
              `pixels: (${(rightIris.x * canvas.width).toFixed(1)}, ${(rightIris.y * canvas.height).toFixed(1)}) | ` +
              `z: ${rightIris.z.toFixed(4)}`
            );
          }
        }

        // ---- Shared hand detection: the 2D overlay (Hands) and 3D Reach both
        // read ONE detectForVideo per frame — two calls at the same timestamp
        // throw a monotonicity error. ----
        let handResult = null;
        if ((handsOn || reachOn) && handLandmarker) {
          try {
            handResult = handLandmarker.detectForVideo(video, performance.now());
          } catch (err) {
            console.error("[Eyeball] hand detectForVideo failed:", err);
          }
        }

        // ---------------- HAND TRACKING (point + pinch) ----------------
        if (handsOn && handResult) {
          const hands = handResult.landmarks ?? [];

          for (const hand of hands) {
            drawingUtils.drawConnectors(hand, HandLandmarker.HAND_CONNECTIONS,
              { color: "rgba(0, 229, 255, 0.6)", lineWidth: 2 });
            drawingUtils.drawLandmarks(hand, { color: "#00E5FF", radius: 2.5 });
          }

          let pointedNow = null;
          const hand = hands[0]; // first hand drives the pointer
          if (hand) {
            const tip = hand[8];
            // Pinch = thumb-tip to index-tip distance, normalized by hand
            // size (wrist to middle-finger base) so it works at any distance
            // from the camera. Hysteresis prevents flicker at the threshold.
            const pinchDist = Math.hypot(hand[4].x - tip.x, hand[4].y - tip.y);
            const handSize = Math.hypot(hand[0].x - hand[9].x, hand[0].y - hand[9].y) || 1;
            const ratio = pinchDist / handSize;
            const wasPinched = pinched;
            if (!pinched && ratio < 0.28) pinched = true;
            else if (pinched && ratio > 0.42) pinched = false;

            // Fingertip ring on the canvas (auto-aligned with the video).
            const tx = tip.x * canvas.width, ty = tip.y * canvas.height;
            ctx.beginPath();
            ctx.arc(tx, ty, pinched ? 10 : 16, 0, Math.PI * 2);
            ctx.strokeStyle = "#00E5FF";
            ctx.lineWidth = 3;
            ctx.stroke();
            if (pinched) { ctx.fillStyle = "rgba(0, 229, 255, 0.45)"; ctx.fill(); }

            // Tile interaction happens in screen space.
            const [sx, sy] = videoToScreen(tip.x, tip.y);
            pointedNow = hitTile(sx, sy);
            if (pinched && !wasPinched && pointedNow) activateTile(pointedNow, "Pinched");
          } else {
            pinched = false;
          }

          if (pointedNow !== pointedTile) {
            pointedTile?.classList.remove("pointed");
            pointedNow?.classList.add("pointed");
            pointedTile = pointedNow;
          }
        }

        // ------------ REACH (grab floating 3D objects with your hands) ------------
        if (reachOn && reachRig) updateReach(handResult);

        // ---------------- AVATAR (body skeleton → 3D figure) ----------------
        if (avatarOn && poseLandmarker && avatarRig) {
          let pres = null;
          try {
            pres = poseLandmarker.detectForVideo(video, performance.now());
          } catch (err) {
            console.error("[Eyeball] pose detectForVideo failed:", err);
          }
          // worldLandmarks are metric (metres, hip-centred) — ideal for a 3D
          // figure, independent of where the body sits in the frame.
          updateAvatar(pres?.worldLandmarks?.[0]);
        }
      }

      // Prefer requestVideoFrameCallback (fires exactly once per camera
      // frame) where supported; fall back to requestAnimationFrame.
      if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
        video.requestVideoFrameCallback(renderLoop);
      } else {
        requestAnimationFrame(renderLoop);
      }
    }

    // ------------------------------ BOOT ------------------------------
    startBtn.addEventListener("click", async () => {
      startBtn.classList.add("hidden");
      try {
        await createFaceLandmarker();   // load model first (slow part)
        await startCamera();            // then prompt for camera
        buildTiles();
        mode = "preview";
        calBtn.classList.add("visible");
        modeToggle.classList.add("visible");
        handsBtn.classList.add("visible");
        threeDBtn.classList.add("visible");
        avatarBtn.classList.add("visible");
        reachBtn.classList.add("visible");
        setStatus("Tracking… green dots = iris centers. Pick a mode, then Calibrate.");
        renderLoop();
      } catch (err) {
        // setStatus already showed a specific message; re-show the button
        // so the user can retry after fixing permissions/network.
        startBtn.classList.remove("hidden");
        startBtn.textContent = "⟳ Retry";
      }
    }, { passive: true });

    calBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      runCalibration();
    });
    recalBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    recalBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      runCalibration();
    });

    // Tracking-mode toggle. Switching modes changes the feature set the
    // regression is trained on, so an existing calibration no longer applies:
    // drop back to preview and ask for a fresh calibration.
    modeToggle.addEventListener("pointerdown", (e) => e.stopPropagation());
    modeToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      const wantHead = btn.dataset.mode === "head";
      if (wantHead === useHeadFeatures) return;
      useHeadFeatures = wantHead;
      modeToggle.querySelectorAll("button").forEach((b) =>
        b.classList.toggle("active", b === btn));
      if (mode === "gaze") {
        cal = null;
        smoothed = null;
        targetsEl.classList.remove("visible");
        gazeCursor.style.display = "none";
        recalBtn.classList.remove("visible");
        mode = "preview";
        calBtn.classList.add("visible");
      }
      setStatus(`Mode: ${wantHead ? "eyes + head" : "eyes only"} — tap Calibrate.`);
    });

    // Hand tracking toggle: lazy-loads the hand model on first use, and shows
    // the tiles even without gaze calibration so point-and-pinch works alone.
    handsBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    handsBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!handLandmarker) {
        if (handLoading) return;
        handLoading = true;
        setStatus("Loading hand model…");
        try {
          handLandmarker = await createHandLandmarker();
        } catch (err) {
          console.error("[Eyeball] Hand model init error:", err);
          setStatus("Failed to load hand model. Check network access.", true);
          handLoading = false;
          return;
        }
        handLoading = false;
      }
      handsOn = !handsOn;
      handsBtn.classList.toggle("on", handsOn);
      if (handsOn) {
        targetsEl.classList.add("visible");
        setStatus("Hands on — point with your index finger, pinch to select a tile.");
      } else {
        pinched = false;
        pointedTile?.classList.remove("pointed");
        pointedTile = null;
        if (mode !== "gaze") targetsEl.classList.remove("visible");
        setStatus("Hands off.");
      }
    });

    // 3D mode toggle: build the corridor, stagger tile depths, start the
    // head-coupled parallax, and reveal the tuning controls.
    threeDBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    threeDBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      threeD = !threeD;
      threeDBtn.classList.toggle("on", threeD);
      targetsEl.classList.toggle("three-d", threeD);
      if (threeD) {
        targetsEl.style.perspective = `${PERSP}px`; // set once — not per frame
        applyRoomScale();
        targetsEl.classList.toggle("sandbox", !params.showTiles);
        tileEls.forEach((el, i) =>
          el.style.setProperty("--tz", `${TILE_DEPTHS[i % TILE_DEPTHS.length]}px`));
        headSmooth = null;
        headBaseline = null; // capture the resting position on enable
        lastDolly = "";
        targetsEl.classList.add("visible");
        settingsBtn.classList.add("visible");
        refreshSettingsUI();
        setStatus("3D on — window into a corridor. Tap ⚙️ Tune to tweak it.");
      } else {
        tileEls.forEach((el) => el.style.removeProperty("--tz"));
        targetsEl.style.perspectiveOrigin = "";
        targetsEl.style.perspective = "";
        sceneEl.style.transform = "";
        roomEl.style.transform = "";
        targetsEl.classList.remove("sandbox");
        settingsBtn.classList.remove("visible", "on");
        settingsPanel.classList.remove("visible");
        if (mode !== "gaze" && !handsOn) targetsEl.classList.remove("visible");
        setStatus("3D off.");
      }
    });

    // ---- Window tuning panel ----
    const SLIDERS = ["roomDepthM", "intensity", "pivotDown", "pivotBack", "smooth"];
    const UNIT = { pivotDown: " cm", pivotBack: " cm", roomDepthM: " m", smooth: "", intensity: "×" };
    function refreshSettingsUI() {
      for (const k of SLIDERS) {
        document.getElementById("s_" + k).value = params[k];
        document.getElementById("v_" + k).textContent = params[k] + UNIT[k];
      }
      tilesToggleBtn.textContent = "Tiles: " + (params.showTiles ? "on" : "off");
      tilesToggleBtn.classList.toggle("active", params.showTiles);
    }
    for (const k of SLIDERS) {
      const el = document.getElementById("s_" + k);
      el.addEventListener("pointerdown", (e) => e.stopPropagation());
      el.addEventListener("input", () => {
        params[k] = parseFloat(el.value);
        if (k === "roomDepthM") applyRoomScale();
        refreshSettingsUI();
      });
    }
    settingsBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    settingsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const show = !settingsPanel.classList.contains("visible");
      settingsPanel.classList.toggle("visible", show);
      settingsBtn.classList.toggle("on", show);
    });
    tilesToggleBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    tilesToggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      params.showTiles = !params.showTiles;
      targetsEl.classList.toggle("sandbox", !params.showTiles);
      refreshSettingsUI();
    });
    recenterBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    recenterBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      headBaseline = null; // recapture on the next frame
      setStatus("Re-centered on your current position.");
    });

    // Avatar toggle: lazy-load Three.js + the Pose model, build the rig once,
    // then mirror your whole body live on a 3D stage.
    avatarBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    avatarBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!avatarRig) {
        if (avatarLoading) return;
        avatarLoading = true;
        setStatus("Loading 3D engine and body-tracking model…");
        try {
          if (!THREE) THREE = await import(THREE_URL);
          if (!poseLandmarker) poseLandmarker = await createPoseLandmarker();
          await buildAvatarScene();
        } catch (err) {
          console.error("[Eyeball] Avatar init error:", err);
          setStatus("Failed to load the avatar (3D engine or model). Check network.", true);
          avatarLoading = false;
          return;
        }
        avatarLoading = false;
      }
      avatarOn = !avatarOn;
      avatarBtn.classList.toggle("on", avatarOn);
      avatarCanvas.classList.toggle("visible", avatarOn);
      if (avatarOn) {
        if (reachOn) { reachOn = false; reachBtn.classList.remove("on"); reachCanvas.classList.remove("visible"); flipBtn.classList.remove("visible"); document.body.classList.remove("reach-active"); }
        resizeAvatar();
        setStatus("Avatar on — move your body; it mirrors you. Stand back so you're in frame.");
      } else {
        setStatus("Avatar off.");
      }
    });

    // Reach toggle: lazy-load Three.js + the Hand model, then grab floating 3D
    // objects with your real hands (which stay visible through the clear canvas).
    reachBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    reachBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!reachRig) {
        if (reachLoading) return;
        reachLoading = true;
        setStatus("Loading 3D engine and hand model…");
        try {
          if (!THREE) THREE = await import(THREE_URL);
          if (!handLandmarker) handLandmarker = await createHandLandmarker();
          await buildReachScene();
        } catch (err) {
          console.error("[Eyeball] Reach init error:", err);
          setStatus("Failed to load Reach (3D engine or hand model). Check network.", true);
          reachLoading = false;
          return;
        }
        reachLoading = false;
      }
      reachOn = !reachOn;
      reachBtn.classList.toggle("on", reachOn);
      reachCanvas.classList.toggle("visible", reachOn);
      flipBtn.classList.toggle("visible", reachOn);
      document.body.classList.toggle("reach-active", reachOn);
      if (reachOn) {
        if (avatarOn) { avatarOn = false; avatarBtn.classList.remove("on"); avatarCanvas.classList.remove("visible"); }
        resizeReach();
        setStatus("Reach on — pinch to grab. If your hands look mirrored, tap 🔃 Flip hands.");
      } else {
        setStatus("Reach off.");
      }
    });

    // Flip hands: swap the horizontal convention until the hands read as your
    // own from your point of view (camera/perception dependent — you pick).
    flipBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    flipBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      reachMirror = !reachMirror;
      setStatus(`Flipped hands (${reachMirror ? "A" : "B"}) — pick the one where your palm points into the scene.`);
    });

    window.addEventListener("resize", () => {
      if (avatarOn) resizeAvatar();
      if (reachOn) resizeReach();
    });
  </script>
</body>
</html>
