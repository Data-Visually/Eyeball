<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport-fit=cover + user-scalable=no keeps the full-screen video stable on
    mobile (no accidental pinch-zoom while tapping, no notch letterboxing).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Eyeball — Look &amp; Tap Prototype</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    /*
      Video and canvas are stacked full-screen with identical object-fit: cover
      rules. Because the canvas's internal bitmap is set to the video's native
      resolution (videoWidth x videoHeight), object-fit crops both layers
      identically, so a dot drawn at a landmark's pixel position on the canvas
      lands exactly on that feature in the video — on any screen aspect ratio.

      scaleX(-1) mirrors both layers, giving the "selfie mirror" view users
      expect from a front camera. Landmarks are drawn in un-mirrored video
      coordinates, and the CSS transform flips video + dots together, so they
      stay perfectly registered.
    */
    #video, #overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay { z-index: 2; pointer-events: none; }

    /* ---------- Look & Tap targets ---------- */
    #targets {
      position: fixed;
      z-index: 3;
      inset: 0;
      display: none;
      padding: 6vmin;
      padding-top: max(6vmin, env(safe-area-inset-top));
      padding-bottom: max(14vmin, env(safe-area-inset-bottom));
      box-sizing: border-box;
      pointer-events: none;   /* taps are handled globally: look chooses, any tap confirms */
    }
    #targets.visible { display: block; }
    /* In 3D mode the container becomes the camera: perspective + an origin
       that follows the tracked head position (fish-tank VR). */
    #targets.three-d { perspective: 900px; }
    #scene {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 3vmin;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ---------- The room (window-into-a-3D-scene, 3D mode only) ----------
       A 600px-deep box built from wall planes with grid textures. The scene
       is NEVER rotated — only the perspective-origin moves with your head,
       which is the CSS approximation of an off-axis projection: exactly how
       a real window behaves. */
    #room {
      position: absolute;
      inset: 0;
      display: none;
      transform-style: preserve-3d;
      will-change: transform;
      pointer-events: none;
    }
    #targets.three-d #room { display: block; }
    .face {
      position: absolute;
      background:
        repeating-linear-gradient(0deg,
          rgba(0, 255, 140, 0.16) 0 1px, transparent 1px 60px),
        repeating-linear-gradient(90deg,
          rgba(0, 255, 140, 0.16) 0 1px, transparent 1px 60px),
        rgba(0, 20, 8, 0.25);
    }
    .face.back {
      inset: 0;
      transform: translateZ(-600px);
      background:
        radial-gradient(circle at 50% 50%, rgba(0, 255, 140, 0.10), transparent 70%),
        repeating-linear-gradient(0deg,
          rgba(0, 255, 140, 0.20) 0 1px, transparent 1px 60px),
        repeating-linear-gradient(90deg,
          rgba(0, 255, 140, 0.20) 0 1px, transparent 1px 60px),
        rgba(0, 12, 5, 0.45);
    }
    .face.left   { top: 0; bottom: 0; left: 0;  width: 600px;  transform-origin: left center;   transform: rotateY(90deg); }
    .face.right  { top: 0; bottom: 0; right: 0; width: 600px;  transform-origin: right center;  transform: rotateY(-90deg); }
    .face.top    { left: 0; right: 0; top: 0;    height: 600px; transform-origin: center top;    transform: rotateX(-90deg); }
    .face.bottom { left: 0; right: 0; bottom: 0; height: 600px; transform-origin: center bottom; transform: rotateX(90deg); }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1vmin;
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 3.5vmin;
      transition: border-color 0.12s, background 0.12s, transform 0.12s;
      /* --tz is each tile's depth in 3D mode (0 in flat mode) */
      transform: translateZ(var(--tz, 0px));
    }
    .tile .emoji { font-size: 8vmin; }
    .tile.looked {
      border-color: #00ff44;
      background: rgba(0, 255, 68, 0.18);
      box-shadow: 0 0 24px rgba(0, 255, 68, 0.45);
      transform: translateZ(var(--tz, 0px)) scale(1.04);
    }
    .tile.pointed {
      border-color: #00e5ff;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.45);
    }
    .tile.activated { animation: pop 0.35s ease; }
    @keyframes pop {
      0%   { transform: translateZ(var(--tz, 0px)) scale(1.04); background: rgba(0, 255, 68, 0.18); }
      40%  { transform: translateZ(var(--tz, 0px)) scale(1.15); background: rgba(0, 255, 68, 0.65); }
      100% { transform: translateZ(var(--tz, 0px)) scale(1.04); background: rgba(0, 255, 68, 0.18); }
    }

    /* ---------- Gaze cursor ---------- */
    #gazeCursor {
      position: fixed;
      z-index: 5;
      left: 0;
      top: 0;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;    /* center on the gaze point */
      border: 3px solid #00ff44;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(0, 255, 68, 0.8), inset 0 0 8px rgba(0, 255, 68, 0.5);
      pointer-events: none;
      display: none;
      will-change: transform;
    }

    /* ---------- Calibration target ---------- */
    #calTarget {
      position: fixed;
      z-index: 6;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      border: 4px solid #ffcc00;
      background: radial-gradient(circle, #ffcc00 0 8px, transparent 9px);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.8);
      pointer-events: none;
      display: none;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }
    #calTarget.sampling {
      animation: shrink 0.9s linear forwards;
      border-color: #00ff44;
      box-shadow: 0 0 20px rgba(0, 255, 68, 0.8);
    }
    @keyframes shrink {
      from { transform: scale(1.25); }
      to   { transform: scale(0.45); }
    }

    /* ---------- Status pill & buttons ---------- */
    #status {
      position: fixed;
      z-index: 7;
      left: 50%;
      top: max(18px, env(safe-area-inset-top));
      transform: translateX(-50%);
      max-width: 92vw;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 14px;
      text-align: center;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #status.error { background: rgba(180, 30, 30, 0.85); }
    #status.hidden { opacity: 0; }

    .ctl {
      position: fixed;
      z-index: 6;
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: #00c838;
      color: #002a0c;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .ctl.visible { display: block; }
    #calibrateBtn   { left: 50%; transform: translateX(-50%); }
    #recalibrateBtn { right: 16px; background: rgba(255, 255, 255, 0.85); color: #000; font-size: 13px; padding: 9px 14px; }
    #handsBtn {
      top: max(18px, env(safe-area-inset-top));
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
    }
    #handsBtn.on { background: #00e5ff; color: #00323a; }
    #threeDBtn {
      top: calc(max(18px, env(safe-area-inset-top)) + 46px);
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
    }
    #threeDBtn.on { background: #c77dff; color: #2a0045; }

    /* Tracking-mode segmented toggle (eyes only vs eyes + head) */
    #modeToggle {
      position: fixed;
      z-index: 6;
      left: 50%;
      transform: translateX(-50%);
      /* stacked above the Calibrate button so they never overlap on
         narrow screens */
      bottom: calc(max(20px, env(safe-area-inset-bottom)) + 58px);
      display: none;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    #modeToggle.visible { display: flex; }
    #modeToggle button {
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 13px;
      padding: 9px 12px;
      cursor: pointer;
    }
    #modeToggle button.active {
      background: #00c838;
      color: #002a0c;
      font-weight: 600;
    }

    /* Mobile Safari/Chrome require a user gesture before camera prompts feel
       reliable, and autoplay policies are friendlier after a tap. */
    #start {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      border: 0;
      font-size: 20px;
      cursor: pointer;
    }
    #start.hidden { display: none; }
  </style>
</head>
<body>
  <!--
    playsinline (and its legacy webkit- twin) is mandatory on iOS Safari:
    without it the video hijacks the screen into the native fullscreen player
    and the canvas overlay never shows. muted + autoplay keeps mobile autoplay
    policies happy since we never need audio.
  -->
  <video id="video" autoplay muted playsinline webkit-playsinline></video>
  <canvas id="overlay"></canvas>

  <div id="targets" aria-hidden="true">
    <div id="room">
      <div class="face back"></div>
      <div class="face left"></div>
      <div class="face right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
    <div id="scene"></div>
  </div>
  <div id="gazeCursor"></div>
  <div id="calTarget"></div>

  <div id="status">Loading…</div>
  <button id="calibrateBtn" class="ctl">🎯 Calibrate gaze</button>
  <button id="recalibrateBtn" class="ctl">↻ Recalibrate</button>
  <button id="handsBtn" class="ctl">🖐 Hands</button>
  <button id="threeDBtn" class="ctl">🧊 3D</button>
  <div id="modeToggle">
    <button data-mode="eyes">👀 Eyes only</button>
    <button data-mode="head" class="active">👀+🙂 Eyes + head</button>
  </div>
  <button id="start">👁️ Tap to start eye tracking</button>

  <script type="module">
    import {
      FaceLandmarker,
      HandLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // ---------------------------------------------------------------------
    // Landmark indices (MediaPipe Face Landmarker, 478-point refined mesh).
    // Points 0-467 are the face mesh; 468-477 are the 10 iris landmarks
    // added by iris refinement:
    //   468..472 = RIGHT iris (anatomical right eye): 468 = center, 469-472 = ring
    //   473..477 = LEFT  iris (anatomical left eye):  473 = center, 474-477 = ring
    // Eye contour points used for gaze normalization:
    //   right eye: corners 33 (outer) / 133 (inner), lids 159 (top) / 145 (bottom)
    //   left eye:  corners 362 (inner) / 263 (outer), lids 386 (top) / 374 (bottom)
    // ---------------------------------------------------------------------
    const RIGHT_IRIS_CENTER = 468;
    const LEFT_IRIS_CENTER  = 473;
    const RIGHT_IRIS_RING = [469, 470, 471, 472];
    const LEFT_IRIS_RING  = [474, 475, 476, 477];
    const RIGHT_EYE = { iris: 468, c1: 33,  c2: 133, top: 159, bottom: 145 };
    const LEFT_EYE  = { iris: 473, c1: 362, c2: 263, top: 386, bottom: 374 };
    // Head-pose proxy points: the z (depth) difference between the cheeks
    // tracks yaw, forehead-vs-chin tracks pitch, and the nose tip tracks
    // head position in the frame.
    const NOSE_TIP = 1, CHEEK_R = 234, CHEEK_L = 454, FOREHEAD = 10, CHIN = 152;

    const TILES = [
      ["🎵", "Music"], ["📷", "Camera"],
      ["💬", "Chat"],  ["🗺️", "Maps"],
      ["✉️", "Mail"],  ["⚙️", "Settings"]
    ];

    // 9-point calibration grid, in normalized viewport coordinates.
    const CAL_POINTS = [
      [0.12, 0.12], [0.50, 0.12], [0.88, 0.12],
      [0.88, 0.50], [0.50, 0.50], [0.12, 0.50],
      [0.12, 0.88], [0.50, 0.88], [0.88, 0.88]
    ];
    const SAMPLE_MS = 1000;       // how long we sample gaze per calibration dot
    const SETTLE_MS = 250;        // discard frames right after the tap (phone jiggle)
    const MIN_SAMPLES = 8;        // fewer than this → face was lost, redo the dot
    const BLINK_OPENNESS = 0.10;  // eyelid gap / eye width below this = blink
                                  // (kept low: drooping lids while looking down
                                  // are a gaze SIGNAL, not noise — see openness
                                  // feature — so only reject true blinks)

    const video    = document.getElementById("video");
    const canvas   = document.getElementById("overlay");
    const ctx      = canvas.getContext("2d");
    const drawingUtils = new DrawingUtils(ctx);
    const modeToggle   = document.getElementById("modeToggle");
    const handsBtn     = document.getElementById("handsBtn");
    const threeDBtn    = document.getElementById("threeDBtn");
    const sceneEl      = document.getElementById("scene");
    const roomEl       = document.getElementById("room");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const calBtn   = document.getElementById("calibrateBtn");
    const recalBtn = document.getElementById("recalibrateBtn");
    const calTarget  = document.getElementById("calTarget");
    const gazeCursor = document.getElementById("gazeCursor");
    const targetsEl  = document.getElementById("targets");

    let faceLandmarker = null;
    let frameCount = 0;
    let lastVideoTime = -1;

    // App state: "idle" → "preview" (iris dots only) → "calibrating" → "gaze"
    let mode = "idle";
    let latestFeature = null;   // most recent gaze feature vector
    let sampleBuf = null;       // non-null while calibration is sampling frames
    let cal = null;             // fitted mapping {mean, std, coefX, coefY, rms, useHead}
    let smoothed = null;        // smoothed gaze point, normalized [0..1]
    // Tracking mode: with head features (default), gaze = eyes + natural head
    // movement. Eyes-only drops the head terms (feature indices 16+), for
    // holding the device steady and pointing with the eyes alone.
    const HEAD_START = 16;      // first head-feature index in the 22-dim vector
    let useHeadFeatures = true;

    // Hand tracking (lazy-loaded on first toggle). 21 landmarks per hand:
    // 0 = wrist, 4 = thumb tip, 8 = index tip, 9 = middle-finger base.
    let handLandmarker = null;
    let handsOn = false;
    let handLoading = false;
    let pinched = false;        // pinch state with hysteresis
    let pointedTile = null;     // tile currently under the index fingertip

    // 3D mode: tiles float INSIDE the room (all depths behind the screen
    // plane), camera coupled to the tracked head — a window into a 3D scene.
    const TILE_DEPTHS = [-320, -80, -180, -40, -260, -120]; // px translateZ per tile
    let threeD = false;
    let headSmooth = null;      // smoothed [screenX, screenY, iod]
    let iodBaseline = null;     // head distance captured when 3D is enabled
    let lookedTile = null;      // tile currently under gaze
    let tileEls = [];

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
      statusEl.classList.remove("hidden");
      if (isError) console.error("[Eyeball]", msg);
      else console.log("[Eyeball]", msg);
    }
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));

    // ------------------------- MEDIAPIPE SETUP -------------------------
    let visionFileset = null;
    async function getVision() {
      if (!visionFileset) {
        visionFileset = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
      }
      return visionFileset;
    }

    async function createFaceLandmarker() {
      setStatus("Loading MediaPipe Face Landmarker model…");
      try {
        const filesetResolver = await getVision();

        // NOTE: In the JS tasks-vision API the running modes are "IMAGE" and
        // "VIDEO". "VIDEO" + detectForVideo() per frame IS the live-stream
        // mode on the web (LIVE_STREAM is the Android/iOS SDK name for the
        // same thing).
        const options = {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1,
          // Blendshapes include eyeLookIn/Out/Up/Down — the model's own
          // learned gaze signals, stronger vertically than raw iris geometry.
          outputFaceBlendshapes: true,
          outputFacialTransformationMatrixes: false
        };

        try {
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, options);
        } catch (gpuErr) {
          // Some mobile GPUs / WebGL contexts fail — retry on CPU before giving up.
          console.warn("[Eyeball] GPU delegate failed, retrying with CPU:", gpuErr);
          options.baseOptions.delegate = "CPU";
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, options);
        }

        setStatus("Model loaded ✔");
      } catch (err) {
        setStatus("Failed to load Face Landmarker model. Check network/CDN access.", true);
        console.error("[Eyeball] Model init error:", err);
        throw err;
      }
    }

    async function createHandLandmarker() {
      const options = {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      };
      const filesetResolver = await getVision();
      try {
        return await HandLandmarker.createFromOptions(filesetResolver, options);
      } catch (gpuErr) {
        console.warn("[Eyeball] Hand GPU delegate failed, retrying with CPU:", gpuErr);
        options.baseOptions.delegate = "CPU";
        return await HandLandmarker.createFromOptions(filesetResolver, options);
      }
    }

    // --------------------------- CAMERA SETUP ---------------------------
    async function startCamera() {
      if (!window.isSecureContext) {
        setStatus("Camera requires HTTPS (or localhost). Serve this page over a secure origin.", true);
        throw new Error("Insecure context: getUserMedia is unavailable.");
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("getUserMedia is not supported in this browser.", true);
        throw new Error("getUserMedia unsupported.");
      }

      setStatus("Requesting camera permission…");
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",            // front-facing camera
            // Higher capture resolution = more pixels on the eyes = less
            // iris-landmark jitter. MediaPipe crops the face region, so
            // this improves accuracy more than it costs.
            width:  { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
      } catch (err) {
        const hint = err.name === "NotAllowedError"
          ? "Permission denied — allow camera access in browser settings and reload."
          : err.name === "NotFoundError"
            ? "No front-facing camera found."
            : `Camera error: ${err.name}`;
        setStatus(hint, true);
        console.error("[Eyeball] getUserMedia error:", err);
        throw err;
      }

      video.srcObject = stream;

      // Wait until the video has real dimensions before sizing the canvas.
      await new Promise((resolve) => {
        if (video.readyState >= HTMLMediaElement.HAVE_METADATA) resolve();
        else video.addEventListener("loadedmetadata", resolve, { once: true });
      });
      // iOS Safari sometimes needs an explicit play() even with autoplay.
      try { await video.play(); } catch (e) { console.warn("[Eyeball] video.play():", e); }

      // Canvas bitmap = native camera resolution → landmark math is 1:1 with
      // the video frame; CSS object-fit handles the on-screen scaling/crop.
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      console.log(`[Eyeball] Camera ready: ${video.videoWidth}x${video.videoHeight}`);
    }

    // ----------------------- GAZE FEATURE EXTRACTION -----------------------
    // Four features per eye, all normalized by eye width so they're stable
    // against head distance:
    //   [0] iris x-offset from the eye-corner midpoint (horizontal gaze)
    //   [1] iris y-offset from the eye-corner midpoint (vertical gaze)
    //   [2] iris-to-eyelid balance: closer to the upper or lower lid —
    //       a second, independent vertical-gaze signal
    //   [3] eye openness: lids droop when looking down, widen looking up
    function eyeFeature(lm, eye) {
      const c1 = lm[eye.c1], c2 = lm[eye.c2];
      const w = Math.hypot(c1.x - c2.x, c1.y - c2.y);
      if (w < 1e-6) return null;
      const top = lm[eye.top], bottom = lm[eye.bottom];
      const openness = Math.hypot(top.x - bottom.x, top.y - bottom.y) / w;
      if (openness < BLINK_OPENNESS) return null; // true blink — iris unreliable
      const cx = (c1.x + c2.x) / 2;
      const cy = (c1.y + c2.y) / 2;
      const iris = lm[eye.iris];
      const balance =
        (Math.hypot(iris.x - top.x, iris.y - top.y) -
         Math.hypot(iris.x - bottom.x, iris.y - bottom.y)) / w;
      return [(iris.x - cx) / w, (iris.y - cy) / w, balance, openness];
    }

    // MediaPipe's 8 learned gaze blendshapes, fed to the regression
    // individually (it learns each one's sign and weight itself).
    const GAZE_BLENDSHAPES = [
      "eyeLookInLeft", "eyeLookOutLeft", "eyeLookUpLeft", "eyeLookDownLeft",
      "eyeLookInRight", "eyeLookOutRight", "eyeLookUpRight", "eyeLookDownRight"
    ];
    let blendIdx = null;
    function blendGaze(categories) {
      if (!categories) return new Array(GAZE_BLENDSHAPES.length).fill(0);
      if (!blendIdx) {
        blendIdx = {};
        categories.forEach((c, i) => { blendIdx[c.categoryName] = i; });
      }
      return GAZE_BLENDSHAPES.map((n) => categories[blendIdx[n]]?.score ?? 0);
    }

    // Full gaze feature vector — 22 dimensions:
    //   [0..3]   right-eye iris geometry   [4..7]  left-eye iris geometry
    //   [8..15]  the 8 eyeLook* blendshape scores
    //   [16..21] head pose & position: yaw, pitch, roll, nose x/y,
    //            inter-ocular distance (distance to screen)
    // Head terms are essential: people naturally turn their head partway
    // toward what they look at, so a mapping trained on eyeball rotation
    // alone systematically under-shoots at runtime (the cursor "won't reach
    // the edges"). The regression learns each user's personal head/eye mix.
    function computeGazeFeature(lm, blendshapes) {
      const r = eyeFeature(lm, RIGHT_EYE);
      const l = eyeFeature(lm, LEFT_EYE);
      if (!r && !l) return null;   // both eyes blinking/occluded
      const rr = r ?? l, ll = l ?? r; // wink tolerance: mirror the open eye

      const b = blendGaze(blendshapes);

      const hx = lm[CHEEK_R].z - lm[CHEEK_L].z;   // yaw proxy (depth diff)
      const hy = lm[FOREHEAD].z - lm[CHIN].z;     // pitch proxy (depth diff)
      const outerR = lm[33], outerL = lm[263];    // outer eye corners
      const roll = Math.atan2(outerL.y - outerR.y, outerL.x - outerR.x);
      const iod  = Math.hypot(outerL.x - outerR.x, outerL.y - outerR.y);
      const nose = lm[NOSE_TIP];                  // head position in frame

      return [...rr, ...ll, ...b, hx, hy, roll, nose.x, nose.y, iod];
    }

    // --------------------- CALIBRATION & REGRESSION ---------------------
    // Every sampled frame (not per-dot averages) becomes a training row:
    // ~200+ samples over 9 dots. Features are standardized, expanded with
    // quadratic terms on the four iris offsets (indices 0,1 right / 4,5 left
    // — the terms with real curvature), and ridge-fit per axis.
    const basis = (f) =>
      [1, ...f, f[0] * f[0], f[1] * f[1], f[4] * f[4], f[5] * f[5]];
    const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);

    function solveLinear(A, b) { // Gauss-Jordan with partial pivoting
      const n = b.length;
      const M = A.map((row, i) => [...row, b[i]]);
      for (let col = 0; col < n; col++) {
        let piv = col;
        for (let r = col + 1; r < n; r++)
          if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
        [M[col], M[piv]] = [M[piv], M[col]];
        if (Math.abs(M[col][col]) < 1e-12) throw new Error("Singular calibration matrix");
        for (let r = 0; r < n; r++) {
          if (r === col) continue;
          const f = M[r][col] / M[col][col];
          for (let c = col; c <= n; c++) M[r][c] -= f * M[col][c];
        }
      }
      return M.map((row, i) => row[n] / row[i]);
    }

    function fitMapping(samples) {
      const dim = samples[0].f.length;
      const n = samples.length;

      // Standardize each feature so the ridge penalty treats them equally
      // (iris offsets are ~0.05, blendshape diffs ~1, z-depth diffs ~0.1).
      const mean = new Array(dim).fill(0);
      for (const s of samples)
        for (let i = 0; i < dim; i++) mean[i] += s.f[i] / n;
      const std = new Array(dim).fill(0);
      for (const s of samples)
        for (let i = 0; i < dim; i++) std[i] += (s.f[i] - mean[i]) ** 2 / n;
      for (let i = 0; i < dim; i++) std[i] = Math.max(Math.sqrt(std[i]), 1e-6);
      const norm = (f) => f.map((v, i) => (v - mean[i]) / std[i]);

      const X = samples.map((s) => basis(norm(s.f)));
      const k = X[0].length;
      const lambda = 1e-3 * n; // mild ridge; keeps collinear features stable
      const AtA = Array.from({ length: k }, () => new Array(k).fill(0));
      for (const row of X)
        for (let i = 0; i < k; i++)
          for (let j = 0; j < k; j++) AtA[i][j] += row[i] * row[j];
      for (let i = 1; i < k; i++) AtA[i][i] += lambda; // don't penalize the bias

      const fitAxis = (axis) => {
        const Atb = new Array(k).fill(0);
        samples.forEach((s, r) => {
          for (let i = 0; i < k; i++) Atb[i] += X[r][i] * s.t[axis];
        });
        return solveLinear(AtA, Atb);
      };
      const coefX = fitAxis(0);
      const coefY = fitAxis(1);

      let se = 0;
      samples.forEach((s, r) => {
        se += (dot(X[r], coefX) - s.t[0]) ** 2 + (dot(X[r], coefY) - s.t[1]) ** 2;
      });
      return { mean, std, coefX, coefY, rms: Math.sqrt(se / n) };
    }

    function waitForTap() {
      return new Promise((resolve) => {
        // Small delay so the tap that advanced the previous step (or opened
        // calibration) can't double-fire into this one.
        setTimeout(() => {
          document.addEventListener("pointerdown", resolve, { once: true });
        }, 350);
      });
    }

    async function runCalibration() {
      mode = "calibrating";
      calBtn.classList.remove("visible");
      recalBtn.classList.remove("visible");
      modeToggle.classList.remove("visible");
      handsBtn.classList.remove("visible");
      threeDBtn.classList.remove("visible");
      targetsEl.classList.remove("visible");
      gazeCursor.style.display = "none";
      cal = null;
      smoothed = null;

      const samples = [];
      let i = 0;
      while (i < CAL_POINTS.length) {
        const [nx, ny] = CAL_POINTS[i];
        calTarget.style.display = "block";
        calTarget.classList.remove("sampling");
        calTarget.style.transform = ""; // let the pulse animation own transform
        calTarget.style.left = `${nx * 100}vw`;
        calTarget.style.top  = `${ny * 100}vh`;
        const hint = useHeadFeatures ? "" : " — keep your head still";
        setStatus(`Look at the yellow dot, then tap anywhere (${i + 1}/${CAL_POINTS.length})${hint}`);

        await waitForTap();

        // Keep looking at the dot: let the tap-jiggle settle, then sample
        // gaze features for ~1s. Every frame becomes a training sample.
        calTarget.classList.add("sampling");
        await delay(SETTLE_MS);
        sampleBuf = [];
        await delay(SAMPLE_MS);
        const buf = sampleBuf;
        sampleBuf = null;

        if (buf.length < MIN_SAMPLES) {
          setStatus("Face lost during sampling — let's redo that dot.");
          await delay(1200);
          continue; // retry the same point
        }
        for (const f of buf)
          samples.push({ f: useHeadFeatures ? f : f.slice(0, HEAD_START), t: [nx, ny] });
        i++;
      }

      calTarget.style.display = "none";
      try {
        cal = { ...fitMapping(samples), useHead: useHeadFeatures };
      } catch (err) {
        console.error("[Eyeball] Calibration fit failed:", err);
        setStatus("Calibration failed — please try again.", true);
        mode = "preview";
        calBtn.classList.add("visible");
        modeToggle.classList.add("visible");
        handsBtn.classList.add("visible");
        threeDBtn.classList.add("visible");
        return;
      }
      console.log(
        `[Eyeball] Calibration complete: ${samples.length} samples, ` +
        `training fit error ≈ ${(cal.rms * 100).toFixed(1)}% of screen`,
        cal
      );

      enterGazeMode();
    }

    // --------------------------- LOOK & TAP ---------------------------
    function buildTiles() {
      sceneEl.innerHTML = "";
      tileEls = TILES.map(([emoji, label]) => {
        const el = document.createElement("div");
        el.className = "tile";
        el.innerHTML = `<span class="emoji">${emoji}</span><span>${label}</span>`;
        el.dataset.label = label;
        sceneEl.appendChild(el);
        return el;
      });
    }

    // Head-coupled window: the scene is NEVER rotated — a real window doesn't
    // turn to face you. Only the perspective-origin (the viewer's eye
    // position) follows the tracked head, which approximates an off-axis
    // projection: near and far geometry shift against each other exactly as
    // through a physical window. Leaning in dollies the whole room closer.
    function updateParallax(lm) {
      if (!threeD) return;
      const nose = lm[NOSE_TIP];
      const outerR = lm[33], outerL = lm[263];
      const iod = Math.hypot(outerL.x - outerR.x, outerL.y - outerR.y);
      const sx = 1 - nose.x; // mirror-aware: screen-space head position
      const sy = nose.y;

      headSmooth = headSmooth
        ? headSmooth.map((v, i) => v + ([sx, sy, iod][i] - v) * 0.25)
        : [sx, sy, iod];
      if (!iodBaseline) iodBaseline = headSmooth[2];

      // Amplified eye position: head movement is small relative to screen
      // size, so scale it up for a strong look-around effect.
      const ox = 50 + (headSmooth[0] - 0.5) * 220;
      const oy = 50 + (headSmooth[1] - 0.5) * 220;
      targetsEl.style.perspectiveOrigin = `${ox.toFixed(1)}% ${oy.toFixed(1)}%`;

      // Lean in → dolly into the room; lean back → retreat to the window.
      const dz = Math.max(-180, Math.min(320,
        (headSmooth[2] / iodBaseline - 1) * 900));
      const dolly = `translateZ(${dz.toFixed(1)}px)`;
      sceneEl.style.transform = dolly;
      roomEl.style.transform = dolly;
    }

    function enterGazeMode() {
      mode = "gaze";
      targetsEl.classList.add("visible");
      gazeCursor.style.display = "block";
      recalBtn.classList.add("visible");
      modeToggle.classList.add("visible");
      handsBtn.classList.add("visible");
      threeDBtn.classList.add("visible");
      const quality = cal && cal.rms < 0.06 ? "good" : "rough — consider recalibrating";
      setStatus(`Calibrated (fit: ${quality}). Look at a tile, tap ANYWHERE to select.`);
    }

    function hitTile(px, py) {
      for (const el of tileEls) {
        const r = el.getBoundingClientRect();
        if (px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return el;
      }
      return null;
    }

    function activateTile(el, verb) {
      el.classList.remove("activated");
      void el.offsetWidth; // restart the CSS animation
      el.classList.add("activated");
      setStatus(`✔ ${verb}: ${el.dataset.label}`);
      console.log(`[Eyeball] ${verb}: ${el.dataset.label}`);
      if (navigator.vibrate) navigator.vibrate(30);
    }

    // Map a normalized video coordinate to screen pixels, accounting for the
    // object-fit: cover crop and the CSS mirror — needed to hit-test DOM
    // tiles against a fingertip tracked in video space.
    function videoToScreen(nx, ny) {
      const vw = window.innerWidth, vh = window.innerHeight;
      const scale = Math.max(vw / canvas.width, vh / canvas.height);
      const dw = canvas.width * scale, dh = canvas.height * scale;
      return [(vw - dw) / 2 + (1 - nx) * dw, (vh - dh) / 2 + ny * dh];
    }

    function updateGaze(feature) {
      if (!feature || !cal) return;
      const f = cal.useHead ? feature : feature.slice(0, HEAD_START);
      const b = basis(f.map((v, i) => (v - cal.mean[i]) / cal.std[i]));
      let gx = dot(b, cal.coefX);
      let gy = dot(b, cal.coefY);
      if (!Number.isFinite(gx) || !Number.isFinite(gy)) return;
      gx = Math.min(1, Math.max(0, gx));
      gy = Math.min(1, Math.max(0, gy));

      if (!smoothed) {
        smoothed = [gx, gy];
      } else {
        // Speed-adaptive smoothing: heavy filtering while fixating (steady
        // cursor), light filtering during saccades (fast catch-up, no lag).
        const a = Math.min(0.8,
          0.12 + Math.hypot(gx - smoothed[0], gy - smoothed[1]) * 5);
        smoothed = [smoothed[0] + (gx - smoothed[0]) * a,
                    smoothed[1] + (gy - smoothed[1]) * a];
      }

      const px = smoothed[0] * window.innerWidth;
      const py = smoothed[1] * window.innerHeight;
      gazeCursor.style.transform = `translate3d(${px}px, ${py}px, 0)`;

      // Highlight the tile under the gaze point.
      const hit = hitTile(px, py);
      if (hit !== lookedTile) {
        lookedTile?.classList.remove("looked");
        hit?.classList.add("looked");
        lookedTile = hit;
      }
    }

    // Look chooses, tap confirms: any tap activates whichever tile the user
    // is currently looking at.
    document.addEventListener("pointerdown", (e) => {
      if (mode !== "gaze") return;
      if (e.target === recalBtn) return;
      if (lookedTile) {
        activateTile(lookedTile, "Selected");
      } else {
        setStatus("No tile under gaze — look at a tile, then tap.");
      }
    });

    // ----------------- DETECTION LOOP + VISUALIZATION -----------------
    function drawIrisDot(landmark, ringIndices, landmarks) {
      const x = landmark.x * canvas.width;
      const y = landmark.y * canvas.height;

      // Estimate iris radius from the ring landmarks so the marker scales
      // with distance from the camera.
      let radius = 4;
      if (ringIndices.length) {
        let sum = 0;
        for (const i of ringIndices) {
          const dx = (landmarks[i].x - landmark.x) * canvas.width;
          const dy = (landmarks[i].y - landmark.y) * canvas.height;
          sum += Math.hypot(dx, dy);
        }
        radius = Math.max(3, sum / ringIndices.length);
      }

      // High-contrast marker: bright green fill, dark outline, crosshair dot.
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = "#00FF44";
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(x, y, 3, 0, Math.PI * 2);
      ctx.fillStyle = "#00FF44";
      ctx.strokeStyle = "rgba(0,0,0,0.8)";
      ctx.lineWidth = 1.5;
      ctx.fill();
      ctx.stroke();
    }

    function renderLoop() {
      // Only run inference when a NEW frame is available; on mobile the
      // camera is often 30fps while rAF runs at 60fps — detecting the same
      // frame twice wastes battery and can confuse the VIDEO-mode timestamp
      // requirement (timestamps must be monotonically increasing).
      if (video.currentTime !== lastVideoTime && video.videoWidth > 0) {
        lastVideoTime = video.currentTime;

        let result;
        try {
          result = faceLandmarker.detectForVideo(video, performance.now());
        } catch (err) {
          console.error("[Eyeball] detectForVideo failed:", err);
          result = null;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (result?.faceLandmarks?.length) {
          // 478 normalized 3D landmarks (x, y in [0,1]; z = relative depth).
          const landmarks = result.faceLandmarks[0];

          // Wireframe face mesh while calibrating — visual confirmation that
          // tracking is solid on every dot (and it looks great).
          if (mode === "calibrating") {
            drawingUtils.drawConnectors(
              landmarks,
              FaceLandmarker.FACE_LANDMARKS_TESSELATION,
              { color: "rgba(0, 255, 140, 0.25)", lineWidth: 0.6 }
            );
          }

          const rightIris = landmarks[RIGHT_IRIS_CENTER];
          const leftIris  = landmarks[LEFT_IRIS_CENTER];

          drawIrisDot(rightIris, RIGHT_IRIS_RING, landmarks);
          drawIrisDot(leftIris,  LEFT_IRIS_RING,  landmarks);

          updateParallax(landmarks);

          const feature = computeGazeFeature(
            landmarks,
            result.faceBlendshapes?.[0]?.categories
          );
          if (feature) {
            latestFeature = feature;
            if (sampleBuf) sampleBuf.push(feature);
            if (mode === "gaze") updateGaze(feature);
          }

          frameCount++;
          if (frameCount % 60 === 0) {
            console.log(
              `[Eyeball] Right iris center — ` +
              `normalized: (${rightIris.x.toFixed(4)}, ${rightIris.y.toFixed(4)}) | ` +
              `pixels: (${(rightIris.x * canvas.width).toFixed(1)}, ${(rightIris.y * canvas.height).toFixed(1)}) | ` +
              `z: ${rightIris.z.toFixed(4)}`
            );
          }
        }

        // ---------------- HAND TRACKING (point + pinch) ----------------
        if (handsOn && handLandmarker) {
          let hres = null;
          try {
            hres = handLandmarker.detectForVideo(video, performance.now());
          } catch (err) {
            console.error("[Eyeball] hand detectForVideo failed:", err);
          }
          const hands = hres?.landmarks ?? [];

          for (const hand of hands) {
            drawingUtils.drawConnectors(hand, HandLandmarker.HAND_CONNECTIONS,
              { color: "rgba(0, 229, 255, 0.6)", lineWidth: 2 });
            drawingUtils.drawLandmarks(hand, { color: "#00E5FF", radius: 2.5 });
          }

          let pointedNow = null;
          const hand = hands[0]; // first hand drives the pointer
          if (hand) {
            const tip = hand[8];
            // Pinch = thumb-tip to index-tip distance, normalized by hand
            // size (wrist to middle-finger base) so it works at any distance
            // from the camera. Hysteresis prevents flicker at the threshold.
            const pinchDist = Math.hypot(hand[4].x - tip.x, hand[4].y - tip.y);
            const handSize = Math.hypot(hand[0].x - hand[9].x, hand[0].y - hand[9].y) || 1;
            const ratio = pinchDist / handSize;
            const wasPinched = pinched;
            if (!pinched && ratio < 0.28) pinched = true;
            else if (pinched && ratio > 0.42) pinched = false;

            // Fingertip ring on the canvas (auto-aligned with the video).
            const tx = tip.x * canvas.width, ty = tip.y * canvas.height;
            ctx.beginPath();
            ctx.arc(tx, ty, pinched ? 10 : 16, 0, Math.PI * 2);
            ctx.strokeStyle = "#00E5FF";
            ctx.lineWidth = 3;
            ctx.stroke();
            if (pinched) { ctx.fillStyle = "rgba(0, 229, 255, 0.45)"; ctx.fill(); }

            // Tile interaction happens in screen space.
            const [sx, sy] = videoToScreen(tip.x, tip.y);
            pointedNow = hitTile(sx, sy);
            if (pinched && !wasPinched && pointedNow) activateTile(pointedNow, "Pinched");
          } else {
            pinched = false;
          }

          if (pointedNow !== pointedTile) {
            pointedTile?.classList.remove("pointed");
            pointedNow?.classList.add("pointed");
            pointedTile = pointedNow;
          }
        }
      }

      // Prefer requestVideoFrameCallback (fires exactly once per camera
      // frame) where supported; fall back to requestAnimationFrame.
      if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
        video.requestVideoFrameCallback(renderLoop);
      } else {
        requestAnimationFrame(renderLoop);
      }
    }

    // ------------------------------ BOOT ------------------------------
    startBtn.addEventListener("click", async () => {
      startBtn.classList.add("hidden");
      try {
        await createFaceLandmarker();   // load model first (slow part)
        await startCamera();            // then prompt for camera
        buildTiles();
        mode = "preview";
        calBtn.classList.add("visible");
        modeToggle.classList.add("visible");
        handsBtn.classList.add("visible");
        threeDBtn.classList.add("visible");
        setStatus("Tracking… green dots = iris centers. Pick a mode, then Calibrate.");
        renderLoop();
      } catch (err) {
        // setStatus already showed a specific message; re-show the button
        // so the user can retry after fixing permissions/network.
        startBtn.classList.remove("hidden");
        startBtn.textContent = "⟳ Retry";
      }
    }, { passive: true });

    calBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      runCalibration();
    });
    recalBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    recalBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      runCalibration();
    });

    // Tracking-mode toggle. Switching modes changes the feature set the
    // regression is trained on, so an existing calibration no longer applies:
    // drop back to preview and ask for a fresh calibration.
    modeToggle.addEventListener("pointerdown", (e) => e.stopPropagation());
    modeToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      const wantHead = btn.dataset.mode === "head";
      if (wantHead === useHeadFeatures) return;
      useHeadFeatures = wantHead;
      modeToggle.querySelectorAll("button").forEach((b) =>
        b.classList.toggle("active", b === btn));
      if (mode === "gaze") {
        cal = null;
        smoothed = null;
        targetsEl.classList.remove("visible");
        gazeCursor.style.display = "none";
        recalBtn.classList.remove("visible");
        mode = "preview";
        calBtn.classList.add("visible");
      }
      setStatus(`Mode: ${wantHead ? "eyes + head" : "eyes only"} — tap Calibrate.`);
    });

    // Hand tracking toggle: lazy-loads the hand model on first use, and shows
    // the tiles even without gaze calibration so point-and-pinch works alone.
    handsBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    handsBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!handLandmarker) {
        if (handLoading) return;
        handLoading = true;
        setStatus("Loading hand model…");
        try {
          handLandmarker = await createHandLandmarker();
        } catch (err) {
          console.error("[Eyeball] Hand model init error:", err);
          setStatus("Failed to load hand model. Check network access.", true);
          handLoading = false;
          return;
        }
        handLoading = false;
      }
      handsOn = !handsOn;
      handsBtn.classList.toggle("on", handsOn);
      if (handsOn) {
        targetsEl.classList.add("visible");
        setStatus("Hands on — point with your index finger, pinch to select a tile.");
      } else {
        pinched = false;
        pointedTile?.classList.remove("pointed");
        pointedTile = null;
        if (mode !== "gaze") targetsEl.classList.remove("visible");
        setStatus("Hands off.");
      }
    });

    // 3D mode toggle: stagger tile depths and start head-coupled parallax.
    threeDBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    threeDBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      threeD = !threeD;
      threeDBtn.classList.toggle("on", threeD);
      targetsEl.classList.toggle("three-d", threeD);
      if (threeD) {
        tileEls.forEach((el, i) =>
          el.style.setProperty("--tz", `${TILE_DEPTHS[i % TILE_DEPTHS.length]}px`));
        headSmooth = null;
        iodBaseline = null; // re-baseline "how far away is the user" on enable
        targetsEl.classList.add("visible");
        setStatus("3D on — a window into a room. Move your head; lean in to enter.");
      } else {
        tileEls.forEach((el) => el.style.removeProperty("--tz"));
        targetsEl.style.perspectiveOrigin = "";
        sceneEl.style.transform = "";
        roomEl.style.transform = "";
        if (mode !== "gaze" && !handsOn) targetsEl.classList.remove("visible");
        setStatus("3D off.");
      }
    });
  </script>
</body>
</html>
