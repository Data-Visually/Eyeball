<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport-fit=cover + user-scalable=no keeps the full-screen video stable on
    mobile (no accidental pinch-zoom while tapping, no notch letterboxing).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Eyeball — Look &amp; Tap Prototype</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    /*
      Video and canvas are stacked full-screen with identical object-fit: cover
      rules. Because the canvas's internal bitmap is set to the video's native
      resolution (videoWidth x videoHeight), object-fit crops both layers
      identically, so a dot drawn at a landmark's pixel position on the canvas
      lands exactly on that feature in the video — on any screen aspect ratio.

      scaleX(-1) mirrors both layers, giving the "selfie mirror" view users
      expect from a front camera. Landmarks are drawn in un-mirrored video
      coordinates, and the CSS transform flips video + dots together, so they
      stay perfectly registered.
    */
    #video, #overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #overlay { z-index: 2; pointer-events: none; }
    /* Reach is first-person: un-mirror the camera (and the hand-skeleton
       overlay) so your hands read as reaching THROUGH the screen, not a
       selfie reflection. */
    body.reach-active #video,
    body.reach-active #overlay { transform: none; }
    /* Avatar stage: an opaque WebGL canvas that covers the video when the
       skeleton-driven 3D figure is on. */
    #avatarCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      display: none;
      pointer-events: none;
    }
    #avatarCanvas.visible { display: block; }
    /* Reach stage: a TRANSPARENT WebGL canvas over the video — your real hands
       stay visible underneath, virtual objects float on top to be grabbed. */
    #reachCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      display: none;
      pointer-events: none;
    }
    #reachCanvas.visible { display: block; }
    #reachBtn {
      top: calc(max(18px, env(safe-area-inset-top)) + 184px);
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
    }
    #reachBtn.on { background: #ffd93d; color: #3a2f00; }
    #flipBtn {
      top: calc(max(18px, env(safe-area-inset-top)) + 230px);
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
      display: none;
    }
    #flipBtn.visible { display: block; }
    #avatarBtn {
      top: calc(max(18px, env(safe-area-inset-top)) + 138px);
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
    }
    #avatarBtn.on { background: #ff7ad9; color: #45002f; }

    /* ---------- Look & Tap targets ---------- */
    #targets {
      position: fixed;
      z-index: 3;
      inset: 0;
      display: none;
      padding: 6vmin;
      padding-top: max(6vmin, env(safe-area-inset-top));
      padding-bottom: max(14vmin, env(safe-area-inset-bottom));
      box-sizing: border-box;
      pointer-events: none;   /* taps are handled globally: look chooses, any tap confirms */
    }
    #targets.visible { display: block; }
    /* In 3D mode the container becomes the camera: perspective + an origin
       that follows the tracked head position (fish-tank VR). */
    /* In 3D mode the container becomes a solid portal: an opaque dark
       backdrop hides the camera feed so the corridor reads as a real space
       you're looking INTO, not a wireframe floating over your face. */
    #targets.three-d {
      perspective: 900px;
      background: radial-gradient(circle at 50% 42%, #06170d 0%, #010402 72%);
    }
    #scene {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 3vmin;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* ---------- The corridor (window-into-a-3D-scene) ----------
       A deep tunnel of grid-textured wall planes plus depth rings. The scene
       is NEVER rotated — only the perspective-origin moves with the viewer's
       tracked eye position, the CSS form of an off-axis projection: exactly
       how a real window behaves. Corridor depth is the --depth custom
       property, live-tunable from the settings panel. */
    #room {
      position: absolute;
      inset: 0;
      --depth: 2200px;
      display: none;
      transform-style: preserve-3d;
      will-change: transform;
      pointer-events: none;
    }
    #targets.three-d #room { display: block; }
    .wall {
      position: absolute;
      /* Near-opaque so the walls occlude the camera and each other, giving
         solid surfaces instead of a see-through wireframe. */
      background:
        repeating-linear-gradient(0deg,
          rgba(0, 255, 150, 0.28) 0 1px, transparent 1px 64px),
        repeating-linear-gradient(90deg,
          rgba(0, 255, 150, 0.28) 0 1px, transparent 1px 64px),
        linear-gradient(rgba(3, 26, 15, 0.94), rgba(1, 12, 7, 0.94));
    }
    .wall.back {
      inset: 0;
      transform: translateZ(calc(-1 * var(--depth)));
      /* Glowing far end — the "light at the end of the corridor" vanishing
         point that gives the tunnel its pull. */
      background:
        radial-gradient(circle at 50% 50%, rgba(130, 255, 205, 0.55), rgba(0, 60, 32, 0.85) 55%, rgba(0, 20, 11, 0.95) 100%),
        repeating-linear-gradient(0deg,
          rgba(0, 255, 150, 0.30) 0 1px, transparent 1px 64px),
        repeating-linear-gradient(90deg,
          rgba(0, 255, 150, 0.30) 0 1px, transparent 1px 64px),
        rgba(0, 18, 10, 0.96);
    }
    .wall.left   { top: 0; bottom: 0; left: 0;  width: var(--depth);  transform-origin: left center;   transform: rotateY(90deg); }
    .wall.right  { top: 0; bottom: 0; right: 0; width: var(--depth);  transform-origin: right center;  transform: rotateY(-90deg); }
    .wall.ceil   { left: 0; right: 0; top: 0;    height: var(--depth); transform-origin: center top;    transform: rotateX(-90deg); }
    .wall.floor  { left: 0; right: 0; bottom: 0; height: var(--depth); transform-origin: center bottom; transform: rotateX(90deg); }
    /* backface-visibility hidden reduces GPU work and coplanar shimmer. */
    #room, #scene, .wall, .ring, .tile { backface-visibility: hidden; }
    #rings { position: absolute; inset: 0; transform-style: preserve-3d; }
    .ring {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(80, 255, 180, 0.5);
      box-shadow: inset 0 0 40px rgba(0, 255, 150, 0.18), 0 0 12px rgba(0, 255, 150, 0.15);
    }
    /* Sandbox: hide the app tiles, leaving a pure corridor to tune against. */
    #targets.sandbox #scene { display: none; }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1vmin;
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 3.5vmin;
      transition: border-color 0.12s, background 0.12s, transform 0.12s;
      /* --tz is each tile's depth in 3D mode (0 in flat mode) */
      transform: translateZ(var(--tz, 0px));
    }
    .tile .emoji { font-size: 8vmin; }
    .tile.looked {
      border-color: #00ff44;
      background: rgba(0, 255, 68, 0.18);
      box-shadow: 0 0 24px rgba(0, 255, 68, 0.45);
      transform: translateZ(var(--tz, 0px)) scale(1.04);
    }
    .tile.pointed {
      border-color: #00e5ff;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.45);
    }
    .tile.activated { animation: pop 0.35s ease; }
    @keyframes pop {
      0%   { transform: translateZ(var(--tz, 0px)) scale(1.04); background: rgba(0, 255, 68, 0.18); }
      40%  { transform: translateZ(var(--tz, 0px)) scale(1.15); background: rgba(0, 255, 68, 0.65); }
      100% { transform: translateZ(var(--tz, 0px)) scale(1.04); background: rgba(0, 255, 68, 0.18); }
    }

    /* ---------- Gaze cursor ---------- */
    #gazeCursor {
      position: fixed;
      z-index: 5;
      left: 0;
      top: 0;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;    /* center on the gaze point */
      border: 3px solid #00ff44;
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(0, 255, 68, 0.8), inset 0 0 8px rgba(0, 255, 68, 0.5);
      pointer-events: none;
      display: none;
      will-change: transform;
    }

    /* ---------- Calibration target ---------- */
    #calTarget {
      position: fixed;
      z-index: 6;
      left: 0;
      top: 0;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      border: 4px solid #ffcc00;
      background: radial-gradient(circle, #ffcc00 0 8px, transparent 9px);
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.8);
      pointer-events: none;
      display: none;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }
    #calTarget.sampling {
      animation: shrink 0.9s linear forwards;
      border-color: #00ff44;
      box-shadow: 0 0 20px rgba(0, 255, 68, 0.8);
    }
    @keyframes shrink {
      from { transform: scale(1.25); }
      to   { transform: scale(0.45); }
    }

    /* ---------- Status pill & buttons ---------- */
    #status {
      position: fixed;
      z-index: 7;
      left: 50%;
      top: max(18px, env(safe-area-inset-top));
      transform: translateX(-50%);
      max-width: 92vw;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 14px;
      text-align: center;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    #status.error { background: rgba(180, 30, 30, 0.85); }
    #status.hidden { opacity: 0; }

    .ctl {
      position: fixed;
      z-index: 6;
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: #00c838;
      color: #002a0c;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .ctl.visible { display: block; }
    #calibrateBtn   { left: 50%; transform: translateX(-50%); }
    #recalibrateBtn { right: 16px; background: rgba(255, 255, 255, 0.85); color: #000; font-size: 13px; padding: 9px 14px; }
    #handsBtn {
      top: max(18px, env(safe-area-inset-top));
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
    }
    #handsBtn.on { background: #00e5ff; color: #00323a; }
    #threeDBtn {
      top: calc(max(18px, env(safe-area-inset-top)) + 46px);
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
    }
    #threeDBtn.on { background: #c77dff; color: #2a0045; }
    #settingsBtn {
      top: calc(max(18px, env(safe-area-inset-top)) + 92px);
      bottom: auto;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      font-size: 13px;
      padding: 9px 14px;
    }
    #settingsBtn.on { background: #00e58c; color: #00281a; }

    /* ---------- Window tuning panel ---------- */
    #settings {
      position: fixed;
      z-index: 7;
      left: 16px;
      top: max(18px, env(safe-area-inset-top));
      width: 210px;
      max-width: 62vw;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(0, 255, 140, 0.3);
      color: #cfffe6;
      font-size: 12px;
      display: none;
      /* Force the panel onto its own stable compositor layer so the corridor's
         3D rendering can't starve it (was going black/unclickable under load). */
      isolation: isolate;
      transform: translateZ(0);
      will-change: transform;
    }
    #settings.visible { display: block; }
    #settings h4 { margin: 0 0 6px; font-size: 12px; color: #8affc4; letter-spacing: 0.05em; }
    #settings label { display: flex; justify-content: space-between; margin: 9px 0 2px; }
    #settings label span:last-child { color: #fff; font-variant-numeric: tabular-nums; }
    #settings input[type=range] { width: 100%; accent-color: #00e58c; margin: 0; }
    #settings .row { display: flex; gap: 8px; margin-top: 11px; }
    #settings .row button {
      flex: 1; border: 0; border-radius: 8px; padding: 7px 8px;
      background: rgba(0, 229, 140, 0.2); color: #cfffe6; font-size: 12px; cursor: pointer;
    }
    #settings .row button.active { background: #00e58c; color: #00281a; font-weight: 600; }
    #readout {
      margin-top: 10px; font-family: ui-monospace, monospace; font-size: 11px;
      color: #7fffce; white-space: pre; line-height: 1.5;
    }

    /* Tracking-mode segmented toggle (eyes only vs eyes + head) */
    #modeToggle {
      position: fixed;
      z-index: 6;
      left: 50%;
      transform: translateX(-50%);
      /* stacked above the Calibrate button so they never overlap on
         narrow screens */
      bottom: calc(max(20px, env(safe-area-inset-bottom)) + 58px);
      display: none;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    #modeToggle.visible { display: flex; }
    #modeToggle button {
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 13px;
      padding: 9px 12px;
      cursor: pointer;
    }
    #modeToggle button.active {
      background: #00c838;
      color: #002a0c;
      font-weight: 600;
    }

    /* Mobile Safari/Chrome require a user gesture before camera prompts feel
       reliable, and autoplay policies are friendlier after a tap. */
    #start {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      border: 0;
      font-size: 20px;
      cursor: pointer;
    }
    #start.hidden { display: none; }
  </style>
</head>
<body>
  <!--
    playsinline (and its legacy webkit- twin) is mandatory on iOS Safari:
    without it the video hijacks the screen into the native fullscreen player
    and the canvas overlay never shows. muted + autoplay keeps mobile autoplay
    policies happy since we never need audio.
  -->
  <video id="video" autoplay muted playsinline webkit-playsinline></video>
  <canvas id="overlay"></canvas>
  <canvas id="avatarCanvas"></canvas>
  <canvas id="reachCanvas"></canvas>

  <div id="targets" aria-hidden="true">
    <div id="room">
      <div class="wall back"></div>
      <div class="wall left"></div>
      <div class="wall right"></div>
      <div class="wall ceil"></div>
      <div class="wall floor"></div>
      <div id="rings"></div>
    </div>
    <div id="scene"></div>
  </div>
  <div id="gazeCursor"></div>
  <div id="calTarget"></div>

  <div id="status">Loading…</div>
  <button id="calibrateBtn" class="ctl">🎯 Calibrate gaze</button>
  <button id="recalibrateBtn" class="ctl">↻ Recalibrate</button>
  <button id="handsBtn" class="ctl">🖐 Hands</button>
  <button id="threeDBtn" class="ctl">🧊 3D</button>
  <button id="settingsBtn" class="ctl">⚙️ Tune</button>
  <button id="avatarBtn" class="ctl">🕺 Avatar</button>
  <button id="reachBtn" class="ctl">🫳 Reach</button>
  <button id="flipBtn" class="ctl">🔃 Flip hands</button>
  <div id="settings">
    <h4>🎛 WINDOW TUNING</h4>
    <label>Room depth <span id="v_roomDepthM"></span></label>
    <input type="range" id="s_roomDepthM" min="0.5" max="15" step="0.5" />
    <label>Intensity <span id="v_intensity"></span></label>
    <input type="range" id="s_intensity" min="0.3" max="4" step="0.1" />
    <label>Pivot down <span id="v_pivotDown"></span></label>
    <input type="range" id="s_pivotDown" min="0" max="20" step="0.5" />
    <label>Pivot back <span id="v_pivotBack"></span></label>
    <input type="range" id="s_pivotBack" min="0" max="25" step="0.5" />
    <label>Smoothing <span id="v_smooth"></span></label>
    <input type="range" id="s_smooth" min="0.05" max="1" step="0.05" />
    <div class="row">
      <button id="tilesToggle">Tiles: on</button>
      <button id="recenterBtn">Re-center</button>
    </div>
    <div id="readout"></div>
  </div>
  <div id="modeToggle">
    <button data-mode="eyes">👀 Eyes only</button>
    <button data-mode="head" class="active">👀+🙂 Eyes + head</button>
  </div>
  <button id="start">👁️ Tap to start eye tracking</button>

  <script type="module">
    import {
      FaceLandmarker,
      HandLandmarker,
      PoseLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    // Three.js is loaded lazily (only when Avatar mode is first enabled) so it
    // never weighs down initial page load. Same CDN as tasks-vision.
    const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    let THREE = null;

    // ---------------------------------------------------------------------
    // Landmark indices (MediaPipe Face Landmarker, 478-point refined mesh).
    // Points 0-467 are the face mesh; 468-477 are the 10 iris landmarks
    // added by iris refinement:
    //   468..472 = RIGHT iris (anatomical right eye): 468 = center, 469-472 = ring
    //   473..477 = LEFT  iris (anatomical left eye):  473 = center, 474-477 = ring
    // Eye contour points used for gaze normalization:
    //   right eye: corners 33 (outer) / 133 (inner), lids 159 (top) / 145 (bottom)
    //   left eye:  corners 362 (inner) / 263 (outer), lids 386 (top) / 374 (bottom)
    // ---------------------------------------------------------------------
    const RIGHT_IRIS_CENTER = 468;
    const LEFT_IRIS_CENTER  = 473;
    const RIGHT_IRIS_RING = [469, 470, 471, 472];
    const LEFT_IRIS_RING  = [474, 475, 476, 477];
    const RIGHT_EYE = { iris: 468, c1: 33,  c2: 133, top: 159, bottom: 145 };
    const LEFT_EYE  = { iris: 473, c1: 362, c2: 263, top: 386, bottom: 374 };
    // Head-pose proxy points: the z (depth) difference between the cheeks
    // tracks yaw, forehead-vs-chin tracks pitch, and the nose tip tracks
    // head position in the frame.
    const NOSE_TIP = 1, CHEEK_R = 234, CHEEK_L = 454, FOREHEAD = 10, CHIN = 152;

    const TILES = [
      ["🎵", "Music"], ["📷", "Camera"],
      ["💬", "Chat"],  ["🗺️", "Maps"],
      ["✉️", "Mail"],  ["⚙️", "Settings"]
    ];

    // 9-point calibration grid, in normalized viewport coordinates.
    const CAL_POINTS = [
      [0.12, 0.12], [0.50, 0.12], [0.88, 0.12],
      [0.88, 0.50], [0.50, 0.50], [0.12, 0.50],
      [0.12, 0.88], [0.50, 0.88], [0.88, 0.88]
    ];
    const SAMPLE_MS = 1000;       // how long we sample gaze per calibration dot
    const SETTLE_MS = 250;        // discard frames right after the tap (phone jiggle)
    const MIN_SAMPLES = 8;        // fewer than this → face was lost, redo the dot
    const BLINK_OPENNESS = 0.10;  // eyelid gap / eye width below this = blink
                                  // (kept low: drooping lids while looking down
                                  // are a gaze SIGNAL, not noise — see openness
                                  // feature — so only reject true blinks)

    const video    = document.getElementById("video");
    const canvas   = document.getElementById("overlay");
    const ctx      = canvas.getContext("2d");
    const drawingUtils = new DrawingUtils(ctx);
    const modeToggle   = document.getElementById("modeToggle");
    const handsBtn     = document.getElementById("handsBtn");
    const threeDBtn    = document.getElementById("threeDBtn");
    const sceneEl      = document.getElementById("scene");
    const roomEl       = document.getElementById("room");
    const settingsBtn  = document.getElementById("settingsBtn");
    const avatarBtn    = document.getElementById("avatarBtn");
    const reachBtn     = document.getElementById("reachBtn");
    const flipBtn      = document.getElementById("flipBtn");
    const settingsPanel = document.getElementById("settings");
    const readoutEl    = document.getElementById("readout");
    const tilesToggleBtn = document.getElementById("tilesToggle");
    const recenterBtn  = document.getElementById("recenterBtn");
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("start");
    const calBtn   = document.getElementById("calibrateBtn");
    const recalBtn = document.getElementById("recalibrateBtn");
    const calTarget  = document.getElementById("calTarget");
    const gazeCursor = document.getElementById("gazeCursor");
    const targetsEl  = document.getElementById("targets");

    let faceLandmarker = null;
    let frameCount = 0;
    let lastVideoTime = -1;

    // App state: "idle" → "preview" (iris dots only) → "calibrating" → "gaze"
    let mode = "idle";
    let latestFeature = null;   // most recent gaze feature vector
    let sampleBuf = null;       // non-null while calibration is sampling frames
    let cal = null;             // fitted mapping {mean, std, coefX, coefY, rms, useHead}
    let smoothed = null;        // smoothed gaze point, normalized [0..1]
    // Tracking mode: with head features (default), gaze = eyes + natural head
    // movement. Eyes-only drops the head terms (feature indices 16+), for
    // holding the device steady and pointing with the eyes alone.
    const HEAD_START = 16;      // first head-feature index in the 22-dim vector
    let useHeadFeatures = true;

    // Hand tracking (lazy-loaded on first toggle). 21 landmarks per hand:
    // 0 = wrist, 4 = thumb tip, 8 = index tip, 9 = middle-finger base.
    let handLandmarker = null;
    let handsOn = false;
    let handLoading = false;
    let pinched = false;        // pinch state with hysteresis
    let pointedTile = null;     // tile currently under the index fingertip

    // Avatar (full-body skeleton → 3D figure). Lazy-loaded on first toggle.
    const avatarCanvas = document.getElementById("avatarCanvas");
    let poseLandmarker = null;
    let avatarOn = false;
    let avatarLoading = false;
    let avatarRig = null;       // Three.js scene objects, built once
    const poseSmooth = [];      // EMA-smoothed world landmark positions

    // Reach (first-person: grab floating 3D objects with your real hands).
    const reachCanvas = document.getElementById("reachCanvas");
    let reachOn = false;
    let reachLoading = false;
    let reachRig = null;        // Three.js scene: floating grabbable objects
    // Which horizontal convention makes the hands read as first-person is
    // camera/perception dependent and can't be verified without a live hand,
    // so it's a user toggle. true = selfie-mirror (1-x); false = direct. The z
    // sign flips with it so the mapping stays a proper rotation either way.
    let reachMirror = true;

    // 3D mode: tiles float INSIDE the corridor (all depths behind the screen
    // plane), camera coupled to the viewer's tracked eye — a window into a
    // 3D scene.
    const TILE_DEPTHS = [-320, -80, -180, -40, -260, -120]; // px translateZ per tile
    let threeD = false;
    let headSmooth = null;      // smoothed eye/pivot position [x, y, dist] (~cm)
    let headBaseline = null;    // resting position captured on 3D enable / re-center

    // Live-tunable window parameters (settings panel). pivotDown / pivotBack
    // locate the neck rotation pivot relative to the face centre — tune them
    // until turning your head in place produces ZERO scene movement.
    const params = {
      pivotDown: 8,    // cm below face centre to the neck pivot
      pivotBack: 10,   // cm behind face centre to the neck pivot
      smooth: 0.25,    // EMA factor (lower = steadier, higher = snappier)
      roomDepthM: 3,   // corridor depth (metres) → sets the (bounded) room scale
      intensity: 1.0,  // 0.5 subtle/realistic … 4 extreme (party games)
      showTiles: true
    };
    // Corridor depth is BOUNDED in px. CSS 3D compositing loses float precision
    // past a few thousand px of translateZ — that was the source of the green-
    // line flicker, the tearing, and the GPU pressure that blanked the panel.
    // We keep all depth in a safe band; the ratio still conveys "deeper room".
    const corridorDepthPx = () => Math.max(600, Math.min(2600, params.roomDepthM * 480));
    const PERSP = 1100;    // fixed perspective (px); set once, never per-frame
    const REACH_CM = 25;   // head travel (cm) that reaches the shift limit @ 1×
    let lastDolly = "";
    let lookedTile = null;      // tile currently under gaze
    let tileEls = [];

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("error", isError);
      statusEl.classList.remove("hidden");
      if (isError) console.error("[Eyeball]", msg);
      else console.log("[Eyeball]", msg);
    }
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));

    // ------------------------- MEDIAPIPE SETUP -------------------------
    let visionFileset = null;
    async function getVision() {
      if (!visionFileset) {
        visionFileset = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
      }
      return visionFileset;
    }

    async function createFaceLandmarker() {
      setStatus("Loading MediaPipe Face Landmarker model…");
      try {
        const filesetResolver = await getVision();

        // NOTE: In the JS tasks-vision API the running modes are "IMAGE" and
        // "VIDEO". "VIDEO" + detectForVideo() per frame IS the live-stream
        // mode on the web (LIVE_STREAM is the Android/iOS SDK name for the
        // same thing).
        const options = {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1,
          // Blendshapes include eyeLookIn/Out/Up/Down — the model's own
          // learned gaze signals, stronger vertically than raw iris geometry.
          outputFaceBlendshapes: true,
          // The transformation matrix separates head ROTATION from head
          // TRANSLATION — 3D window mode uses only the translation, so
          // turning your head in place doesn't shift the scene.
          outputFacialTransformationMatrixes: true
        };

        try {
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, options);
        } catch (gpuErr) {
          // Some mobile GPUs / WebGL contexts fail — retry on CPU before giving up.
          console.warn("[Eyeball] GPU delegate failed, retrying with CPU:", gpuErr);
          options.baseOptions.delegate = "CPU";
          faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, options);
        }

        setStatus("Model loaded ✔");
      } catch (err) {
        setStatus("Failed to load Face Landmarker model. Check network/CDN access.", true);
        console.error("[Eyeball] Model init error:", err);
        throw err;
      }
    }

    async function createHandLandmarker() {
      const options = {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      };
      const filesetResolver = await getVision();
      try {
        return await HandLandmarker.createFromOptions(filesetResolver, options);
      } catch (gpuErr) {
        console.warn("[Eyeball] Hand GPU delegate failed, retrying with CPU:", gpuErr);
        options.baseOptions.delegate = "CPU";
        return await HandLandmarker.createFromOptions(filesetResolver, options);
      }
    }

    async function createPoseLandmarker() {
      const options = {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1
      };

      try {
        return await PoseLandmarker.createFromOptions(filesetResolver, options);
      } catch (gpuErr) {
